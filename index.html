<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="התיק שלי">
<meta name="theme-color" content="#0B0E17" id="themeColor">
<title>התיק שלי</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<script>
  // apply theme before paint
  try { const t = localStorage.getItem('tiki-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
/* ============ tokens ============ */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#F6F7FA; --ink:#0E1422; --ink-2:#3A4356; --muted:#5F687C;
  --line:#E4E7EE; --gain:#0E9F6E; --gain-soft:rgba(14,159,110,.12); --loss:#DC3F45; --loss-soft:rgba(220,63,69,.1);
  --dep:#8A94AB; --accent:#10B981; --on-accent:#04140D; --btn:#0E1422; --on-btn:#FFFFFF;
  --scrim:rgba(8,11,20,.42); --shadow:0 1px 2px rgba(14,20,34,.04),0 8px 24px rgba(14,20,34,.06);
  --tabbar:rgba(255,255,255,.82);
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --font:-apple-system,"SF Pro Text","SF Hebrew",system-ui,"Segoe UI","Heebo","Arial Hebrew",sans-serif;
  --display:-apple-system,"SF Pro Display","SF Hebrew",system-ui,"Segoe UI","Heebo","Arial Hebrew",sans-serif;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.2,.8,.2,1);
}
:root:not([data-theme="light"]){ color-scheme:dark }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0E17; --surface:#151A27; --surface-2:#1C2233; --ink:#F3F5FA; --ink-2:#C9CFDD; --muted:#98A1B8;
    --line:rgba(255,255,255,.08); --gain:#3DDC97; --gain-soft:rgba(61,220,151,.14); --loss:#FF6B70; --loss-soft:rgba(255,107,112,.14);
    --dep:#7D88A6; --accent:#3DDC97; --on-accent:#04140D; --btn:#F3F5FA; --on-btn:#0B0E17;
    --scrim:rgba(0,0,0,.6); --shadow:none; --tabbar:rgba(21,26,39,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#0B0E17; --surface:#151A27; --surface-2:#1C2233; --ink:#F3F5FA; --ink-2:#C9CFDD; --muted:#98A1B8;
  --line:rgba(255,255,255,.08); --gain:#3DDC97; --gain-soft:rgba(61,220,151,.14); --loss:#FF6B70; --loss-soft:rgba(255,107,112,.14);
  --dep:#7D88A6; --accent:#3DDC97; --on-accent:#04140D; --btn:#F3F5FA; --on-btn:#0B0E17;
  --scrim:rgba(0,0,0,.6); --shadow:none; --tabbar:rgba(21,26,39,.8); color-scheme:dark;
}
:root[data-theme="light"]{ color-scheme:light }

/* ============ base ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.n{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
.gain{color:var(--gain)} .loss{color:var(--loss)}
.press{transition:transform .12s var(--ease),opacity .12s}
.press:active{transform:scale(.97);opacity:.85}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{max-width:560px;margin:0 auto;padding:calc(var(--top) + 8px) 0 calc(var(--bot) + 110px)}
.view{display:none;animation:fade .22s var(--ease)}
.view.active{display:block}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* large title bar */
.titlebar{display:flex;align-items:flex-end;justify-content:space-between;padding:8px 20px 4px;min-height:56px}
.titlebar h1{font-family:var(--display);font-size:32px;font-weight:800;letter-spacing:-.02em;margin:0}
.titlebar .side{font-size:15px;color:var(--muted);padding-bottom:6px}

/* ============ hero ============ */
.hero{padding:6px 20px 0}
.hero-cap{font-size:15px;color:var(--muted);min-height:22px}
.hero-amt{font-family:var(--display);font-size:52px;font-weight:700;letter-spacing:-.035em;line-height:1.05;margin:2px 0 10px;text-align:right}
.hero-delta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:30px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:15px;font-weight:700;padding:4px 10px 4px 12px;border-radius:999px}
.pill.gain{background:var(--gain-soft)} .pill.loss{background:var(--loss-soft)}
.pill svg{width:14px;height:14px;stroke-width:2.6}
.hero-delta .muted{font-size:15px}

.chart{position:relative;margin:18px 0 0;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart:focus-visible{outline-offset:-2px}
.legend{display:flex;gap:18px;padding:10px 20px 0;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:16px;height:0;border-top:3px solid var(--gain);border-radius:2px}
.sw.dash{border-top:2px dashed var(--dep)}
.chart-hint{font-size:13px;color:var(--muted);padding:4px 20px 0}

/* ============ cards ============ */
.sec{padding:26px 16px 0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 10px}
.sec-h h2{font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:-.01em;margin:0}
.sec-h .link{font-size:15px;color:var(--gain);font-weight:600;padding:6px 0}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:16px}
.stat .lbl{font-size:14px;color:var(--muted);line-height:1.3;display:flex;align-items:center;gap:6px}
.stat .val{display:block;font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:8px;text-align:right}
.stat .foot{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.stat .lbl svg{width:16px;height:16px}

.months{padding:16px 16px 12px;margin-top:10px}
.months-top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:2px 12px;margin-bottom:8px}
.months-top b{font-size:16px}
.months-top span{font-size:14px;color:var(--muted)}

/* list */
.list{background:var(--surface);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:10px 16px;text-align:right;position:relative}
.row:active{background:var(--surface-2)}
.row + .row::before{content:"";position:absolute;top:0;left:16px;right:66px;border-top:1px solid var(--line)}
.row .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--gain-soft);color:var(--gain);flex:none}
.row .ico svg{width:20px;height:20px}
.row .mid{flex:1;min-width:0;display:flex;flex-direction:column}
.row .mid .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.row .mid .s{font-size:14px;color:var(--muted)}
.row .amt{font-weight:700;font-size:17px}
.group{margin-bottom:22px}
.group-h{display:flex;justify-content:space-between;padding:0 8px 8px;font-size:14px;color:var(--muted);font-weight:600}

/* summary strip */
.strip{display:flex;padding:18px 20px 4px;gap:28px}
.strip div{display:flex;flex-direction:column}
.strip small{font-size:14px;color:var(--muted)}
.strip b{font-family:var(--display);font-size:26px;letter-spacing:-.02em;text-align:right}

/* year cards */
.ycard{display:block;width:100%;text-align:right;padding:16px 16px 14px;margin-bottom:10px}
.ycard-top{display:flex;justify-content:space-between;align-items:center}
.ycard-top .y{font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:-.02em}
.ycard-top .tag{font-size:12px;font-weight:700;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:3px 9px;margin-inline-start:8px;vertical-align:middle}
.ycard-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.ycard-grid small{display:block;font-size:13px;color:var(--muted)}
.ycard-grid b{display:block;font-size:16px;text-align:right;margin-top:2px}
.ycard .note{display:flex;align-items:center;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.ycard .note svg{width:16px;height:16px}
.ycard .note b{color:var(--ink)}

/* settings */
.set-row{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:8px 16px;text-align:right;position:relative}
.set-row + .set-row::before{content:"";position:absolute;top:0;left:0;right:66px;border-top:1px solid var(--line)}
.set-row:active{background:var(--surface-2)}
.set-row .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2);flex:none}
.set-row .ico svg{width:19px;height:19px}
.set-row .t{flex:1}
.set-row.danger{color:var(--loss)} .set-row.danger .ico{background:var(--loss-soft);color:var(--loss)}
.set-row .chev{color:var(--muted);transform:scaleX(-1)}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:2px}
.seg button{font-size:14px;font-weight:600;padding:6px 12px;border-radius:8px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.foot-note{font-size:13px;color:var(--muted);padding:10px 20px 0;line-height:1.5}

/* empty */
.welcome{margin:18px 16px 0;padding:24px 20px}
.welcome h2{font-family:var(--display);font-size:24px;letter-spacing:-.02em;margin:0 0 6px}
.welcome p{margin:0 0 18px;color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:14px;margin-bottom:22px}
.step{display:flex;gap:12px;align-items:flex-start}
.step .num{width:28px;height:28px;border-radius:50%;background:var(--gain-soft);color:var(--gain);font-weight:800;display:grid;place-items:center;flex:none;font-size:15px}
.step b{display:block} .step span{font-size:15px;color:var(--muted)}
.empty{text-align:center;padding:56px 32px;color:var(--muted)}
.empty .big{width:64px;height:64px;border-radius:20px;background:var(--surface);display:grid;place-items:center;margin:0 auto 14px;color:var(--gain);box-shadow:var(--shadow)}
.empty .big svg{width:30px;height:30px}
.empty b{display:block;color:var(--ink);font-size:19px;margin-bottom:4px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:var(--r-md);font-weight:700;font-size:17px}
.btn-main{background:var(--btn);color:var(--on-btn)}
.btn-accent{background:var(--accent);color:var(--on-accent)}
.btn-soft{background:var(--surface-2);color:var(--ink)}
.btn-text{color:var(--loss);min-height:48px}
.btn + .btn{margin-top:10px}

/* ============ tab bar ============ */
.tabbar{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--tabbar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line);padding:6px 6px calc(var(--bot) + 6px)}
.tabbar-in{max-width:560px;margin:0 auto;display:flex;align-items:center}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);min-height:48px;justify-content:center}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--ink)}
.tab-add{flex:1;display:grid;place-items:center}
.tab-add button{width:54px;height:54px;border-radius:18px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;
  box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 45%,transparent)}
.tab-add svg{width:26px;height:26px;stroke-width:2.4}

/* ============ sheet ============ */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset:auto 0 0 0;z-index:41;max-width:560px;margin:0 auto;background:var(--surface);border-radius:28px 28px 0 0;
  padding:0 20px calc(var(--bot) + 20px);transform:translateY(105%);transition:transform .34s var(--ease);max-height:92vh;overflow-y:auto;overscroll-behavior:contain}
.sheet.open{transform:none}
.sheet.dragging{transition:none}
.grab{padding:10px 0 6px;cursor:grab;touch-action:none}
.grab i{display:block;width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
:root:not([data-theme="light"]) .grab i{background:rgba(127,135,160,.4)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin:6px 0 18px}
.sheet-h h3{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.01em;margin:0}
.x{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.x svg{width:18px;height:18px;stroke-width:2.4}

.amount-box{background:var(--surface-2);border-radius:var(--r-lg);padding:18px 16px 14px;margin-bottom:12px;text-align:center}
.amount-box label{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.amount-in{display:flex;align-items:baseline;justify-content:center;gap:6px;direction:ltr}
.amount-in span{font-family:var(--display);font-size:34px;font-weight:700;color:var(--muted)}
.amount-in input{font-family:var(--display);font-size:46px;font-weight:700;letter-spacing:-.03em;color:var(--ink);background:none;border:0;outline:none;
  width:1.4ch;min-width:1.4ch;max-width:80vw;text-align:left;padding:0;font-variant-numeric:tabular-nums}
.amount-in input::placeholder{color:var(--muted);opacity:.5}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.chip{font-size:14px;font-weight:700;padding:8px 14px;border-radius:999px;background:var(--surface);min-height:36px}

.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:14px;color:var(--muted);margin:0 4px 6px}
.field input{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--surface-2);border:1.5px solid transparent;border-radius:var(--r-md);
  padding:0 16px;min-height:52px;-webkit-appearance:none;appearance:none}
.field input:focus{outline:none;border-color:var(--accent)}
.err{color:var(--loss);font-size:14px;margin:-4px 4px 12px;min-height:0}
.sheet p.lead{color:var(--muted);margin:-8px 0 18px;font-size:15px}

.pick{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.pick button{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r-lg);background:var(--surface-2);text-align:right}
.pick .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--gain-soft);color:var(--gain);flex:none}
.pick .ico.alt{background:var(--surface);color:var(--ink)}
.pick b{display:block;font-size:17px} .pick span{font-size:14px;color:var(--muted)}

.ystat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.ystat div{background:var(--surface-2);border-radius:var(--r-md);padding:12px 14px}
.ystat small{display:block;font-size:13px;color:var(--muted)}
.ystat b{display:block;font-size:20px;font-family:var(--display);text-align:right;margin-top:2px}
.explain{font-size:15px;color:var(--ink-2);line-height:1.6}
.explain p{margin:0 0 12px}

/* toast */
.toast{position:fixed;left:50%;top:calc(var(--top) + 12px);z-index:60;transform:translate(-50%,-140%);background:var(--btn);color:var(--on-btn);
  padding:10px 16px 10px 18px;border-radius:999px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;
  transition:transform .35s var(--ease);box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast.show{transform:translate(-50%,0)}
.toast svg{width:18px;height:18px;stroke-width:2.6;color:var(--accent)}

.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s var(--ease) .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.draw-fade{animation:fade .9s .6s both}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>

<div class="app">
  <section class="view active" id="v-home"></section>
  <section class="view" id="v-deps"></section>
  <section class="view" id="v-years"></section>
  <section class="view" id="v-settings"></section>
</div>

<nav class="tabbar" aria-label="ניווט">
  <div class="tabbar-in" role="tablist">
    <button class="tab" role="tab" data-v="home" aria-selected="true"><svg class="i"><use href="#i-chart"/></svg>סקירה</button>
    <button class="tab" role="tab" data-v="deps" aria-selected="false"><svg class="i"><use href="#i-list"/></svg>הפקדות</button>
    <div class="tab-add"><button class="press" id="addBtn" aria-label="הוספה"><svg class="i"><use href="#i-plus"/></svg></button></div>
    <button class="tab" role="tab" data-v="years" aria-selected="false"><svg class="i"><use href="#i-cal"/></svg>שנים</button>
    <button class="tab" role="tab" data-v="settings" aria-selected="false"><svg class="i"><use href="#i-gear"/></svg>הגדרות</button>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
/* =========================================================
   utils
   ========================================================= */
const KEY = 'tiki-v1';
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = new Intl.NumberFormat('he-IL', {maximumFractionDigits: 0});
const money = n => '₪' + fmt.format(Math.round(Math.abs(n)));
const sMoney = n => (n < 0 ? '−' : '') + money(n);
const pct = r => (r >= 0 ? '+' : '−') + Math.abs(r * 100).toFixed(1) + '%';
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const T = s => Date.parse(s + 'T00:00:00Z');
const days = (a, b) => (T(b) - T(a)) / 864e5;
const fDate = s => { const [y, m, d] = s.split('-'); return `${+d}.${+m}.${y}`; };
const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const parseAmt = s => parseFloat(String(s).replace(/[^\d.]/g, ''));
const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
const curYear = () => new Date().getFullYear();
const ico = (id, cls = 'i') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* =========================================================
   storage
   ========================================================= */
function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d) return {deposits: d.deposits || [], valuations: d.valuations || {}}; } catch (e) {}
  return {deposits: [], valuations: {}};
}
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('השמירה נכשלה. ייצא גיבוי מההגדרות.', false); } }
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '' + Math.random());

/* =========================================================
   calculations
   ========================================================= */
const sortedDeps = (asc) => [...S.deposits].sort((a, b) => asc ? (a.date < b.date ? -1 : 1) : (a.date < b.date ? 1 : -1));

function allYears() {
  const ys = new Set([curYear()]);
  S.deposits.forEach(d => ys.add(+d.date.slice(0, 4)));
  Object.keys(S.valuations).forEach(y => ys.add(+y));
  return [...ys].sort((a, b) => a - b);
}

// Modified Dietz return for a calendar year
function yearStats(y) {
  const deps = S.deposits.filter(d => +d.date.slice(0, 4) === y);
  const total = sum(deps, d => d.amount);
  const cy = curYear();
  const endM = y < cy ? 12 : (y === cy ? new Date().getMonth() + 1 : 12);
  const firstDep = S.deposits.reduce((m, d) => !m || d.date < m ? d.date : m, null);
  const startM = firstDep && +firstDep.slice(0, 4) === y ? +firstDep.slice(5, 7) : 1;
  const months = Math.max(1, endM - startM + 1);
  const monthly = Array.from({length: 12}, (_, m) => sum(deps.filter(d => +d.date.slice(5, 7) === m + 1), d => d.amount));
  const o = {year: y, total, count: deps.length, avg: total / months, monthly, val: S.valuations[y] || null, ret: null, profit: null, missing: null, V0: null};

  const prev = S.valuations[y - 1];
  let V0 = null, start;
  if (prev) { V0 = prev.value; start = prev.date; }
  else if (!S.deposits.some(d => d.date < `${y}-01-01`)) { V0 = 0; start = `${y - 1}-12-31`; }
  else o.missing = `חסר שווי לסוף ${y - 1}`;
  o.V0 = V0;

  if (!o.val) { if (!o.missing) o.missing = y === cy ? 'הזן שווי עדכני כדי לראות תשואה' : `הזן שווי לסוף ${y}`; return o; }
  if (V0 == null) return o;
  const end = o.val.date, span = days(start, end);
  if (span <= 0) return o;
  const flows = S.deposits.filter(d => d.date > start && d.date <= end);
  const F = sum(flows, d => d.amount);
  const W = sum(flows, d => d.amount * days(d.date, end) / span);
  o.profit = o.val.value - V0 - F;
  const denom = V0 + W;
  o.ret = denom > 0 ? o.profit / denom : null;
  return o;
}

function latestVal() {
  let b = null;
  for (const [y, v] of Object.entries(S.valuations)) if (!b || v.date > b.date) b = {...v, year: +y};
  return b;
}

function xirr(flows) {
  const t0 = flows[0].date;
  const f = r => flows.reduce((s, c) => s + c.amt / Math.pow(1 + r, days(t0, c.date) / 365), 0);
  let lo = -0.9999, hi = 10, flo = f(lo);
  if (flo * f(hi) > 0) return null;
  for (let i = 0; i < 200; i++) {
    const mid = (lo + hi) / 2, fm = f(mid);
    if (Math.abs(fm) < 1e-7) return mid;
    if (flo * fm < 0) hi = mid; else { lo = mid; flo = fm; }
  }
  return (lo + hi) / 2;
}

function overall() {
  const lv = latestVal();
  const totalDep = sum(S.deposits, d => d.amount);
  if (!lv) return {lv: null, totalDep};
  const upTo = sortedDeps(true).filter(d => d.date <= lv.date);
  const dep = sum(upTo, d => d.amount);
  const profit = lv.value - dep;
  let rate = null, annual = false;
  if (upTo.length) {
    if (days(upTo[0].date, lv.date) >= 365) {
      rate = xirr([...upTo.map(d => ({date: d.date, amt: -d.amount})), {date: lv.date, amt: lv.value}]);
      annual = true;
    } else if (dep > 0) rate = profit / dep;
  }
  return {lv, totalDep, dep, profit, rate, annual, simple: dep > 0 ? profit / dep : null};
}

/* =========================================================
   main chart (time-based, scrubbable)
   ========================================================= */
let CH = null; // chart model for scrubbing

function monotonePath(p) {
  const n = p.length;
  if (n < 2) return '';
  if (n === 2) return `M${p[0].x},${p[0].y}L${p[1].x},${p[1].y}`;
  const dx = [], m = [], t = [];
  for (let i = 0; i < n - 1; i++) { dx[i] = p[i + 1].x - p[i].x; m[i] = (p[i + 1].y - p[i].y) / (dx[i] || 1); }
  t[0] = m[0]; t[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (m[i] === 0) { t[i] = t[i + 1] = 0; continue; }
    const a = t[i] / m[i], b = t[i + 1] / m[i], h = a * a + b * b;
    if (h > 9) { const k = 3 / Math.sqrt(h); t[i] = k * a * m[i]; t[i + 1] = k * b * m[i]; }
  }
  let d = `M${p[0].x},${p[0].y}`;
  for (let i = 0; i < n - 1; i++) {
    const h = dx[i] / 3;
    d += `C${p[i].x + h},${p[i].y + t[i] * h} ${p[i + 1].x - h},${p[i + 1].y - t[i + 1] * h} ${p[i + 1].x},${p[i + 1].y}`;
  }
  return d;
}

function buildChart() {
  const deps = sortedDeps(true);
  if (!deps.length) return null;
  const vals = Object.entries(S.valuations).map(([y, v]) => ({date: v.date, value: v.value})).sort((a, b) => a.date < b.date ? -1 : 1);
  const t0 = T(deps[0].date);
  const tEnd = Math.max(T(deps[deps.length - 1].date), vals.length ? T(vals[vals.length - 1].date) : 0, t0 + 30 * 864e5);

  // deposit step series
  const depPts = []; let c = 0;
  deps.forEach(d => { depPts.push({t: T(d.date), v: c}); c += d.amount; depPts.push({t: T(d.date), v: c, date: d.date}); });
  depPts.push({t: tEnd, v: c});

  // value series: starts at first deposit (if no earlier valuation), then each valuation
  const valPts = [];
  if (!vals.length || vals[0].date > deps[0].date) valPts.push({t: t0, v: deps[0].amount, date: deps[0].date, start: true});
  vals.forEach(v => valPts.push({t: T(v.date), v: v.value, date: v.date}));
  const hasVal = vals.length > 0;

  const W = 380, H = 190, padT = 14, padB = 26, padX = 10;
  const maxV = Math.max(...depPts.map(p => p.v), ...(hasVal ? valPts.map(p => p.v) : [0])) * 1.1 || 1;
  const X = t => padX + (t - t0) / (tEnd - t0) * (W - padX * 2);
  const Y = v => padT + (H - padT - padB) * (1 - v / maxV);
  const depAt = t => { let v = 0; for (const d of deps) if (T(d.date) <= t) v += d.amount; return v; };

  // scrub points: valuation points (+ deposits when no valuations)
  const scrub = hasVal
    ? valPts.map(p => ({t: p.t, date: p.date, value: p.v, dep: depAt(p.t), start: p.start}))
    : deps.map(d => ({t: T(d.date), date: d.date, value: null, dep: depAt(T(d.date))}));

  const depPath = depPts.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
  const vp = valPts.map(p => ({x: +X(p.t).toFixed(1), y: +Y(p.v).toFixed(1)}));
  const valPath = hasVal ? monotonePath(vp) : '';
  const area = hasVal ? `${valPath}L${vp[vp.length - 1].x},${H - padB}L${vp[0].x},${H - padB}Z` : '';

  // year ticks
  const y0 = new Date(t0).getUTCFullYear(), y1 = new Date(tEnd).getUTCFullYear();
  const ticks = [];
  for (let y = y0 + 1; y <= y1; y++) ticks.push({x: X(Date.UTC(y, 0, 1)), y});
  const step = Math.ceil(ticks.length / 5) || 1;

  const up = hasVal ? valPts[valPts.length - 1].v >= depAt(valPts[valPts.length - 1].t) : true;
  const col = up ? 'var(--gain)' : 'var(--loss)';
  CH = {W, H, X, Y, scrub, padB, col};

  const last = scrub[scrub.length - 1];
  return `<div class="chart" id="chart" tabindex="0" role="img" aria-label="גרף שווי התיק מול סך ההפקדות. גרור או השתמש בחצים כדי לראות ערכים">
  <svg viewBox="0 0 ${W} ${H}" style="direction:ltr">
    <defs><linearGradient id="gFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".28"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map((k, i) => i % step ? '' : `<line x1="${k.x}" x2="${k.x}" y1="${padT}" y2="${H - padB}" stroke="var(--line)" stroke-dasharray="2 4"/>
      <text x="${k.x}" y="${H - 7}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="-apple-system,system-ui,sans-serif">${k.y}</text>`).join('')}
    <line x1="${padX}" x2="${W - padX}" y1="${H - padB}" y2="${H - padB}" stroke="var(--line)"/>
    ${area ? `<path d="${area}" fill="url(#gFill)" class="${firstPaint ? 'draw-fade' : ''}"/>` : ''}
    <path d="${depPath}" fill="none" stroke="var(--dep)" stroke-width="1.8" stroke-dasharray="4 4" stroke-linejoin="round"/>
    ${valPath ? `<path d="${valPath}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="${firstPaint ? 'draw' : ''}" pathLength="1"/>` : ''}
    ${hasVal ? scrub.map(p => `<circle cx="${X(p.t)}" cy="${Y(p.value)}" r="3.2" fill="var(--bg)" stroke="${col}" stroke-width="2"/>`).join('') : ''}
    <g id="cursor" style="display:none">
      <line id="cLine" y1="${padT - 6}" y2="${H - padB}" stroke="var(--muted)" stroke-width="1"/>
      <circle id="cDep" r="4" fill="var(--dep)" stroke="var(--bg)" stroke-width="2"/>
      <circle id="cVal" r="6.5" fill="${col}" stroke="var(--bg)" stroke-width="3"/>
    </g>
    ${hasVal ? `<circle cx="${X(last.t)}" cy="${Y(last.value)}" r="6" fill="${col}" stroke="var(--bg)" stroke-width="3" id="endDot"/>` : ''}
  </svg></div>
  <div class="legend"><span><i class="sw" style="border-color:${col}"></i>שווי התיק</span><span><i class="sw dash"></i>סך ההפקדות</span></div>`;
}

function heroSet(cap, value, deltaHtml) {
  $('#heroCap').textContent = cap;
  $('#heroAmt').textContent = money(value);
  $('#heroDelta').innerHTML = deltaHtml;
}
function deltaPill(profit, base, label) {
  const up = profit >= 0;
  const p = base > 0 ? ` (${pct(profit / base)})` : '';
  return `<span class="pill ${up ? 'gain' : 'loss'}"><svg class="i" aria-hidden="true"><use href="#i-${up ? 'up' : 'down'}"/></svg><span class="n">${money(profit)}${p}</span></span><span class="muted">${label}</span>`;
}

function bindChart(restore) {
  const el = $('#chart'); if (!el || !CH) return;
  const svg = el.querySelector('svg');
  let idx = -1;
  const show = i => {
    idx = i; const p = CH.scrub[i];
    const g = $('#cursor'); g.style.display = '';
    const x = CH.X(p.t);
    $('#cLine').setAttribute('x1', x); $('#cLine').setAttribute('x2', x);
    $('#cDep').setAttribute('cx', x); $('#cDep').setAttribute('cy', CH.Y(p.dep));
    const cv = $('#cVal');
    if (p.value != null) { cv.style.display = ''; cv.setAttribute('cx', x); cv.setAttribute('cy', CH.Y(p.value)); } else cv.style.display = 'none';
    const ed = $('#endDot'); if (ed) ed.style.display = 'none';
    if (p.value != null) heroSet(p.start ? `הפקדה ראשונה, ${fDate(p.date)}` : `שווי התיק ב-${fDate(p.date)}`, p.value,
      deltaPill(p.value - p.dep, p.dep, `הפקדת עד אז ${money(p.dep)}`));
    else heroSet(`סך ההפקדות עד ${fDate(p.date)}`, p.dep, '');
  };
  const hide = () => { idx = -1; $('#cursor').style.display = 'none'; const ed = $('#endDot'); if (ed) ed.style.display = ''; restore(); };
  const nearest = cx => {
    const r = svg.getBoundingClientRect(), x = (cx - r.left) / r.width * CH.W;
    let b = 0, bd = Infinity; CH.scrub.forEach((p, i) => { const d = Math.abs(CH.X(p.t) - x); if (d < bd) { bd = d; b = i; } });
    return b;
  };
  let active = false;
  el.addEventListener('pointerdown', e => { active = true; el.setPointerCapture(e.pointerId); show(nearest(e.clientX)); });
  el.addEventListener('pointermove', e => { if (active || e.pointerType === 'mouse') { const n = nearest(e.clientX); if (n !== idx) show(n); } });
  const end = () => { active = false; hide(); };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end); el.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') end(); });
  el.addEventListener('keydown', e => {
    const n = CH.scrub.length;
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); const dir = e.key === 'ArrowRight' ? 1 : -1; show(idx < 0 ? n - 1 : Math.max(0, Math.min(n - 1, idx + dir))); }
    if (e.key === 'Escape') hide();
  });
  el.addEventListener('blur', () => { if (idx >= 0) hide(); });
}

/* monthly bars */
function monthBars(st, h = 92) {
  const W = 360, H = h, padB = 20, padT = 8;
  const max = Math.max(1, ...st.monthly) * 1.15;
  const cy = curYear(), cm = new Date().getMonth();
  const bw = (W / 12) * 0.56, gap = W / 12;
  const avgY = padT + (H - padT - padB) * (1 - st.avg / max);
  const bars = st.monthly.map((v, i) => {
    const future = st.year === cy && i > cm;
    const bh = v > 0 ? Math.max(4, (H - padT - padB) * v / max) : 3;
    const x = gap * i + (gap - bw) / 2, y = H - padB - bh;
    const fill = future ? 'var(--line)' : v > 0 ? 'var(--gain)' : 'var(--line)';
    return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="${Math.min(5, bw / 2)}" fill="${fill}"><title>${MONTHS[i]}: ${money(v)}</title></rect>
      <text x="${x + bw / 2}" y="${H - 5}" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-family="-apple-system,system-ui,sans-serif">${i + 1}</text>`;
  }).join('');
  const avgLine = st.avg > 0 ? `<line x1="0" x2="${W}" y1="${avgY}" y2="${avgY}" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="3 4" opacity=".6"/>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;direction:ltr" role="img" aria-label="הפקדות לפי חודש בשנת ${st.year}. ממוצע ${money(st.avg)}">${bars}${avgLine}</svg>`;
}

/* returns bar chart */
function returnsChart(stats) {
  const s = stats.filter(x => x.ret != null);
  if (s.length < 2) return '';
  const W = 360, H = 150, pb = 22, pt = 22;
  const m = Math.max(0.04, ...s.map(x => Math.abs(x.ret)));
  const neg = s.some(x => x.ret < 0);
  const zero = neg ? pt + (H - pt - pb) / 2 : H - pb;
  const k = (neg ? (H - pt - pb) / 2 : H - pt - pb) / m;
  const gap = W / s.length, bw = Math.min(44, gap * 0.52);
  return `<div class="card stat" style="margin-bottom:10px"><span class="lbl">${ico('pulse')}תשואה לפי שנה</span>
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;direction:ltr;margin-top:10px" role="img" aria-label="תשואה שנתית לפי שנה">
    <line x1="0" x2="${W}" y1="${zero}" y2="${zero}" stroke="var(--line)"/>
    ${s.map((x, i) => {
      const cx = gap * i + gap / 2, h = Math.max(2, Math.abs(x.ret) * k), up = x.ret >= 0, y = up ? zero - h : zero;
      const col = up ? 'var(--gain)' : 'var(--loss)';
      return `<rect x="${cx - bw / 2}" y="${y}" width="${bw}" height="${h}" rx="7" fill="${col}"/>
        <text x="${cx}" y="${up ? y - 7 : y + h + 15}" text-anchor="middle" font-size="12" font-weight="700" fill="${col}" font-family="-apple-system,system-ui,sans-serif">${pct(x.ret)}</text>
        <text x="${cx}" y="${H - 5}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="-apple-system,system-ui,sans-serif">${x.year}</text>`;
    }).join('')}
  </svg></div>`;
}

/* =========================================================
   views
   ========================================================= */
let firstPaint = true;

function renderHome() {
  const el = $('#v-home');
  if (!S.deposits.length && !Object.keys(S.valuations).length) {
    el.innerHTML = `<div class="titlebar"><h1>התיק שלי</h1></div>
    <div class="card welcome">
      <h2>מתחילים לעקוב</h2>
      <p>שני דברים בלבד, והאפליקציה מחשבת את השאר.</p>
      <div class="steps">
        <div class="step"><span class="num">1</span><div><b>רושמים כל הפקדה</b><span>סכום ותאריך, פעם בחודש או מתי שמפקידים.</span></div></div>
        <div class="step"><span class="num">2</span><div><b>בסוף כל שנה מזינים את שווי התיק</b><span>ומקבלים תשואה שנתית, ממוצע הפקדה ורווח.</span></div></div>
      </div>
      <button class="btn btn-accent press" data-act="dep">${ico('plus')}הוספת הפקדה ראשונה</button>
      <button class="btn btn-soft press" data-act="sample">צפייה עם נתוני דוגמה</button>
    </div>`;
    return;
  }

  const o = overall();
  const ys = yearStats(curYear());
  const chart = buildChart();

  let cap, val, delta;
  if (o.lv) { cap = `שווי התיק, נכון ל-${fDate(o.lv.date)}`; val = o.lv.value; delta = deltaPill(o.profit, o.dep, 'רווח כולל'); }
  else { cap = 'סך ההפקדות'; val = o.totalDep; delta = `<span class="muted">הזן שווי תיק כדי לראות רווח ותשואה</span>`; }
  const restore = () => heroSet(cap, val, delta);

  const rateTile = o.rate == null
    ? `<div class="card stat"><span class="lbl">${ico('pulse')}תשואה שנתית</span><span class="val n muted">—</span><span class="foot">נדרש שווי תיק</span></div>`
    : `<div class="card stat"><span class="lbl">${ico('pulse')}${o.annual ? 'תשואה שנתית ממוצעת' : 'תשואה מצטברת'}</span>
       <span class="val n ${o.rate >= 0 ? 'gain' : 'loss'}">${pct(o.rate)}</span><span class="foot">${o.annual ? 'משוקללת לפי מועדי ההפקדות' : 'פחות משנה של נתונים'}</span></div>`;

  const recent = sortedDeps(false).slice(0, 4);

  el.innerHTML = `
  <div class="titlebar"><h1>התיק שלי</h1><span class="side">${S.deposits.length} הפקדות</span></div>
  <div class="hero">
    <div class="hero-cap" id="heroCap"></div>
    <div class="hero-amt n" id="heroAmt" aria-live="polite"></div>
    <div class="hero-delta" id="heroDelta"></div>
  </div>
  ${chart || ''}
  <div class="sec">
    <div class="grid2">
      ${rateTile}
      <div class="card stat"><span class="lbl">${ico('wallet')}סך ההפקדות</span><span class="val n">${money(o.totalDep)}</span><span class="foot">מאז ${fDate(sortedDeps(true)[0].date)}</span></div>
    </div>
    <button class="card months press" data-year="${ys.year}" style="display:block;width:100%;text-align:right">
      <div class="months-top"><b>הפקדות חודשיות ב-${ys.year}</b><span>ממוצע <b class="n" style="color:var(--ink)">${money(ys.avg)}</b> לחודש</span></div>
      ${monthBars(ys)}
    </button>
  </div>
  ${recent.length ? `<div class="sec"><div class="sec-h"><h2>הפקדות אחרונות</h2><button class="link" data-go="deps">הכל</button></div>
    <div class="list">${recent.map(depRow).join('')}</div></div>` : ''}`;

  restore();
  bindChart(restore);
  if (firstPaint && !reduced) countUp($('#heroAmt'), val);
  firstPaint = false;
}

function countUp(el, target) {
  const t0 = performance.now(), dur = 900;
  const tick = now => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 4);
    el.textContent = money(target * e);
    if (k < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function depRow(d) {
  return `<button class="row" data-dep="${d.id}">
    <span class="ico">${ico('down')}</span>
    <span class="mid"><span class="t">${d.note ? esc(d.note) : 'הפקדה'}</span><span class="s">${fDate(d.date)}</span></span>
    <span class="amt n">${money(d.amount)}</span></button>`;
}

function renderDeps() {
  const el = $('#v-deps');
  const list = sortedDeps(false);
  if (!list.length) {
    el.innerHTML = `<div class="titlebar"><h1>הפקדות</h1></div>
      <div class="empty"><div class="big">${ico('list')}</div><b>עוד אין הפקדות</b>לחץ על + כדי לרשום את הראשונה.</div>`;
    return;
  }
  const groups = {};
  list.forEach(d => (groups[d.date.slice(0, 7)] ||= []).push(d));
  const ys = yearStats(curYear());
  el.innerHTML = `<div class="titlebar"><h1>הפקדות</h1></div>
    <div class="strip">
      <div><small>סך הכל</small><b class="n">${money(sum(list, d => d.amount))}</b></div>
      <div><small>השנה</small><b class="n">${money(ys.total)}</b></div>
      <div><small>ממוצע חודשי</small><b class="n">${money(ys.avg)}</b></div>
    </div>
    <div class="sec">${Object.entries(groups).map(([k, arr]) => {
      const [y, m] = k.split('-').map(Number);
      return `<div class="group"><div class="group-h"><span>${MONTHS[m - 1]} ${y}</span><span class="n">${money(sum(arr, d => d.amount))}</span></div>
        <div class="list">${arr.map(depRow).join('')}</div></div>`;
    }).join('')}</div>`;
}

function renderYears() {
  const el = $('#v-years');
  const stats = allYears().map(yearStats);
  const cy = curYear();
  el.innerHTML = `<div class="titlebar"><h1>שנים</h1></div>
  <div class="sec" style="padding-top:12px">
    ${returnsChart(stats)}
    ${[...stats].reverse().map(s => `
      <button class="card ycard press" data-year="${s.year}">
        <div class="ycard-top"><span><span class="y n">${s.year}</span>${s.year === cy ? '<span class="tag">שנה נוכחית</span>' : ''}</span>
          ${s.ret == null ? '<span class="muted" style="font-size:22px;font-weight:700">—</span>' : `<span class="pill ${s.ret >= 0 ? 'gain' : 'loss'}" style="font-size:17px"><span class="n">${pct(s.ret)}</span></span>`}</div>
        <div class="ycard-grid">
          <div><small>הופקד</small><b class="n">${money(s.total)}</b></div>
          <div><small>ממוצע לחודש</small><b class="n">${money(s.avg)}</b></div>
          <div><small>${s.year === cy ? 'שווי אחרון' : 'שווי בסוף'}</small><b class="n">${s.val ? money(s.val.value) : '—'}</b></div>
        </div>
        ${s.profit != null ? `<div class="note">${ico(s.profit >= 0 ? 'up' : 'down')}${s.profit >= 0 ? 'רווח' : 'הפסד'} השנה <b class="n ${s.profit >= 0 ? 'gain' : 'loss'}">${money(s.profit)}</b></div>`
          : `<div class="note">${ico('info')}${s.missing}</div>`}
      </button>`).join('')}
  </div>`;
}

function renderSettings() {
  let th = 'auto'; try { th = localStorage.getItem('tiki-theme') || 'auto'; } catch (e) {}
  $('#v-settings').innerHTML = `<div class="titlebar"><h1>הגדרות</h1></div>
  <div class="sec" style="padding-top:12px">
    <div class="list">
      <div class="set-row"><span class="ico">${ico('moon')}</span><span class="t">מראה</span>
        <div class="seg" role="group" aria-label="מראה">
          ${[['auto','אוטומטי'],['light','בהיר'],['dark','כהה']].map(([k, l]) => `<button data-theme-set="${k}" aria-pressed="${th === k}">${l}</button>`).join('')}
        </div></div>
    </div>
  </div>
  <div class="sec"><div class="sec-h"><h2>גיבוי</h2></div>
    <div class="list">
      <button class="set-row" data-act="export"><span class="ico">${ico('share')}</span><span class="t">ייצוא גיבוי</span>${ico('chev', 'i chev')}</button>
      <button class="set-row" data-act="import"><span class="ico">${ico('import')}</span><span class="t">ייבוא גיבוי</span>${ico('chev', 'i chev')}</button>
    </div>
    <p class="foot-note">הנתונים שמורים רק בטלפון הזה. מחיקת האפליקציה מוחקת אותם, לכן כדאי לייצא גיבוי מדי כמה חודשים ולשמור אותו ב-iCloud.</p>
  </div>
  <div class="sec"><div class="list">
      <button class="set-row" data-act="explain"><span class="ico">${ico('info')}</span><span class="t">איך מחושבת התשואה</span>${ico('chev', 'i chev')}</button>
      <button class="set-row danger" data-act="wipe"><span class="ico">${ico('trash')}</span><span class="t">מחיקת כל הנתונים</span></button>
  </div></div>`;
}

function render() { renderHome(); renderDeps(); renderYears(); renderSettings(); }

/* =========================================================
   sheet
   ========================================================= */
function fitAmount(el) { const n = (el.value || el.placeholder).length; el.style.width = (n * 0.66 + 0.4) + 'em'; }
document.addEventListener('input', e => { if (e.target.matches('.amount-in input')) fitAmount(e.target); });
function openSheet(title, body) {
  const sh = $('#sheet');
  sh.innerHTML = `<div class="grab" id="grab"><i></i></div>
    <div class="sheet-h"><h3 id="sheetTitle">${title}</h3><button class="x press" data-close aria-label="סגירה">${ico('x')}</button></div>${body}`;
  sh.scrollTop = 0;
  $('#scrim').classList.add('open'); sh.classList.add('open');
  bindDrag();
  sh.querySelectorAll('.amount-in input').forEach(fitAmount);
}
function closeSheet() { $('#scrim').classList.remove('open'); $('#sheet').classList.remove('open'); $('#sheet').style.transform = ''; }
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

function bindDrag() {
  const sh = $('#sheet'), g = $('#grab');
  let y0 = null, dy = 0;
  g.addEventListener('pointerdown', e => { y0 = e.clientY; dy = 0; sh.classList.add('dragging'); g.setPointerCapture(e.pointerId); });
  g.addEventListener('pointermove', e => { if (y0 == null) return; dy = Math.max(0, e.clientY - y0); sh.style.transform = `translateY(${dy}px)`; });
  const up = () => { if (y0 == null) return; y0 = null; sh.classList.remove('dragging'); if (dy > 90) closeSheet(); else sh.style.transform = ''; };
  g.addEventListener('pointerup', up); g.addEventListener('pointercancel', up);
}

function addMenu() {
  openSheet('מה מוסיפים?', `<div class="pick">
    <button class="press" data-act="dep"><span class="ico">${ico('down')}</span><span><b>הפקדה</b><span>כסף שהכנסת לתיק</span></span></button>
    <button class="press" data-act="val"><span class="ico alt">${ico('pulse')}</span><span><b>שווי התיק</b><span>כמה התיק שווה עכשיו או בסוף שנה</span></span></button>
  </div>`);
}

function depSheet(id) {
  const d = id ? S.deposits.find(x => x.id === id) : null;
  const recentAmts = [...new Set(sortedDeps(false).map(x => x.amount))].slice(0, 3);
  openSheet(d ? 'עריכת הפקדה' : 'הפקדה חדשה', `
    <div class="amount-box">
      <label for="fAmt">סכום ההפקדה</label>
      <div class="amount-in"><span>₪</span><input id="fAmt" inputmode="decimal" autocomplete="off" placeholder="0" value="${d ? d.amount : ''}"></div>
      ${!d && recentAmts.length ? `<div class="chips">${recentAmts.map(a => `<button class="chip press n" data-chip="${a}">${money(a)}</button>`).join('')}</div>` : ''}
    </div>
    <div class="err" id="fErr" role="alert"></div>
    <label class="field"><span>תאריך</span><input type="date" id="fDate" value="${d ? d.date : todayISO()}" max="${todayISO()}"></label>
    <label class="field"><span>הערה (לא חובה)</span><input id="fNote" maxlength="50" placeholder="לדוגמה: משכורת ספטמבר" value="${d && d.note ? esc(d.note) : ''}"></label>
    <button class="btn btn-main press" id="fSave">${d ? 'שמירת שינויים' : 'הוספת הפקדה'}</button>
    ${d ? `<button class="btn btn-text" id="fDel">מחיקת ההפקדה</button>` : ''}`);
  const amt = $('#fAmt');
  if (!d) setTimeout(() => amt.focus(), 350);
  $$('[data-chip]').forEach(c => c.onclick = () => { amt.value = c.dataset.chip; fitAmount(amt); amt.focus(); });
  $('#fSave').onclick = () => {
    const amount = parseAmt(amt.value), date = $('#fDate').value, note = $('#fNote').value.trim();
    if (!(amount > 0)) { $('#fErr').textContent = 'הזן סכום גדול מ-0'; amt.focus(); return; }
    if (!date) { $('#fErr').textContent = 'בחר תאריך'; return; }
    if (d) Object.assign(d, {amount, date, note}); else S.deposits.push({id: uid(), amount, date, note});
    save(); render(); closeSheet(); toast(d ? 'ההפקדה עודכנה' : `נוספה הפקדה של ${money(amount)}`);
  };
  if (d) $('#fDel').onclick = () => {
    if (!confirm('למחוק את ההפקדה?')) return;
    S.deposits = S.deposits.filter(x => x.id !== id); save(); render(); closeSheet(); toast('ההפקדה נמחקה');
  };
}

function valSheet(year) {
  const cy = curYear();
  const y = year || (new Date().getMonth() === 0 && !S.valuations[cy - 1] ? cy - 1 : cy);
  const v = S.valuations[y];
  const def = v ? v.date : (y === cy ? todayISO() : `${y}-12-31`);
  openSheet(v ? `עדכון שווי ${y}` : 'שווי התיק', `
    <p class="lead">הזן את השווי שמופיע באפליקציית ההשקעות. בסוף שנה, הזן את השווי ל-31.12.</p>
    <div class="amount-box">
      <label for="vAmt">שווי התיק</label>
      <div class="amount-in"><span>₪</span><input id="vAmt" inputmode="decimal" autocomplete="off" placeholder="0" value="${v ? v.value : ''}"></div>
    </div>
    <div class="err" id="vErr" role="alert"></div>
    <label class="field"><span>נכון לתאריך</span><input type="date" id="vDate" value="${def}" max="${todayISO()}"></label>
    <button class="btn btn-main press" id="vSave">שמירת שווי</button>
    ${v ? `<button class="btn btn-text" id="vDel">מחיקת השווי של ${y}</button>` : ''}`);
  setTimeout(() => $('#vAmt').focus(), 350);
  $('#vSave').onclick = () => {
    const value = parseAmt($('#vAmt').value), date = $('#vDate').value;
    if (isNaN(value) || value < 0) { $('#vErr').textContent = 'הזן את שווי התיק'; return; }
    if (!date) { $('#vErr').textContent = 'בחר תאריך'; return; }
    const ny = +date.slice(0, 4);
    if (year && ny !== y) delete S.valuations[y];
    const replaced = S.valuations[ny] && ny !== y;
    if (replaced && !confirm(`כבר קיים שווי לשנת ${ny}. להחליף אותו?`)) return;
    S.valuations[ny] = {value, date}; save(); render(); closeSheet(); toast(`השווי של ${ny} נשמר`);
  };
  if (v) $('#vDel').onclick = () => {
    if (!confirm(`למחוק את השווי של ${y}?`)) return;
    delete S.valuations[y]; save(); render(); closeSheet(); toast('השווי נמחק');
  };
}

function yearSheet(y) {
  const s = yearStats(y);
  openSheet(`שנת ${y}`, `
    <div class="ystat">
      <div><small>תשואה</small><b class="n ${s.ret == null ? 'muted' : s.ret >= 0 ? 'gain' : 'loss'}">${s.ret == null ? '—' : pct(s.ret)}</b></div>
      <div><small>${s.profit == null ? 'רווח' : s.profit >= 0 ? 'רווח' : 'הפסד'}</small><b class="n ${s.profit == null ? 'muted' : s.profit >= 0 ? 'gain' : 'loss'}">${s.profit == null ? '—' : money(s.profit)}</b></div>
      <div><small>הופקד</small><b class="n">${money(s.total)}</b></div>
      <div><small>ממוצע לחודש</small><b class="n">${money(s.avg)}</b></div>
      <div><small>שווי בתחילת השנה</small><b class="n">${s.V0 == null ? '—' : money(s.V0)}</b></div>
      <div><small>${s.val ? 'שווי ב-' + fDate(s.val.date) : 'שווי בסוף השנה'}</small><b class="n">${s.val ? money(s.val.value) : '—'}</b></div>
    </div>
    <div class="amount-box" style="text-align:right;padding:14px 12px 8px">
      <div class="months-top" style="padding:0 4px"><b>הפקדות לפי חודש</b><span>${s.count} הפקדות</span></div>
      ${monthBars(s, 110)}
    </div>
    ${s.missing ? `<p class="lead" style="margin:4px 0 14px">${s.missing}.</p>` : ''}
    <button class="btn btn-main press" data-act="val" data-y="${y}">${s.val ? 'עדכון שווי' : 'הזנת שווי'} ל-${y}</button>`);
}

function explainSheet() {
  openSheet('איך מחושבת התשואה', `<div class="explain">
    <p><b>תשואה שנתית</b> מחושבת בשיטת Modified Dietz: הרווח של השנה מחולק בשווי ההתחלתי ועוד ההפקדות, כשכל הפקדה נספרת לפי הזמן שהייתה בתיק. הפקדה מינואר נספרת כמעט במלואה, הפקדה מדצמבר כמעט לא.</p>
    <p><b>רווח השנה</b> = שווי בסוף השנה − שווי בתחילת השנה − ההפקדות של השנה.</p>
    <p><b>תשואה שנתית ממוצעת</b> מחושבת בשיטת XIRR על כל ההפקדות מההתחלה, כמו שבתי השקעות מחשבים. היא מוצגת רק אחרי שנה של נתונים.</p>
    <p><b>ממוצע חודשי</b> = סך ההפקדות בשנה חלקי מספר החודשים שעברו בה.</p></div>
    <button class="btn btn-soft press" data-close>הבנתי</button>`);
}

/* =========================================================
   backup / data
   ========================================================= */
async function exportData() {
  const name = `tiki-backup-${todayISO()}.json`;
  const blob = new Blob([JSON.stringify({app: 'tiki', v: 1, ...S}, null, 2)], {type: 'application/json'});
  try {
    const file = new File([blob], name, {type: 'application/json'});
    if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: name}); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.deposits) || typeof d.valuations !== 'object') throw 0;
    if (!confirm(`לייבא ${d.deposits.length} הפקדות? הנתונים הנוכחיים יוחלפו.`)) return;
    S = {deposits: d.deposits, valuations: d.valuations}; save(); firstPaint = true; render(); toast('הגיבוי יובא');
  } catch (err) { toast('הקובץ לא תקין. בחר קובץ גיבוי של האפליקציה.', false); }
});
function loadSample() {
  const deps = []; const cy = curYear(), cm = new Date().getMonth() + 1;
  for (let y = cy - 2; y <= cy; y++) for (let m = 1; m <= 12; m++) {
    if (y === cy && m > cm) break;
    if (y === cy - 2 && m < 4) continue;
    if ((y * 12 + m) % 7 === 0) continue;
    const amt = y === cy - 2 ? 500 : y === cy - 1 ? 750 : 1000;
    deps.push({id: uid(), date: `${y}-${pad(m)}-10`, amount: amt + (m === 12 ? 1500 : 0), note: m === 12 ? 'בונוס שנתי' : ''});
  }
  S = {deposits: deps, valuations: {
    [cy - 2]: {value: 5350, date: `${cy - 2}-12-31`},
    [cy - 1]: {value: 16900, date: `${cy - 1}-12-31`},
    [cy]: {value: Math.round(16900 * 1.07 + sum(deps.filter(d => d.date.startsWith(cy)), d => d.amount) * 1.02), date: todayISO()}
  }};
  save(); firstPaint = true; render(); toast('נטענו נתוני דוגמה');
}

/* =========================================================
   nav + events
   ========================================================= */
function go(v) {
  $$('.view').forEach(el => el.classList.toggle('active', el.id === 'v-' + v));
  $$('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.v === v));
  window.scrollTo(0, 0);
}
$$('.tab').forEach(t => t.addEventListener('click', () => go(t.dataset.v)));
$('#addBtn').addEventListener('click', addMenu);

document.addEventListener('click', e => {
  const t = e.target.closest('[data-close],[data-act],[data-dep],[data-year],[data-go],[data-theme-set]');
  if (!t) return;
  if (t.hasAttribute('data-close')) return closeSheet();
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.dep) return depSheet(t.dataset.dep);
  if (t.dataset.year) return yearSheet(+t.dataset.year);
  if (t.dataset.themeSet) return setTheme(t.dataset.themeSet);
  switch (t.dataset.act) {
    case 'dep': return depSheet();
    case 'val': return valSheet(t.dataset.y ? +t.dataset.y : null);
    case 'sample': return loadSample();
    case 'export': return exportData();
    case 'import': return $('#importFile').click();
    case 'explain': return explainSheet();
    case 'wipe':
      if (!confirm('למחוק את כל ההפקדות והשווי? אי אפשר לבטל.')) return;
      S = {deposits: [], valuations: {}}; save(); render(); go('home'); toast('כל הנתונים נמחקו');
  }
});

function setTheme(k) {
  try { k === 'auto' ? localStorage.removeItem('tiki-theme') : localStorage.setItem('tiki-theme', k); } catch (e) {}
  if (k === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = k;
  syncThemeColor(); renderSettings();
}
function syncThemeColor() {
  $('#themeColor').setAttribute('content', getComputedStyle(document.documentElement).getPropertyValue('--bg').trim());
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncThemeColor);

let tt;
function toast(msg, ok = true) {
  const t = $('#toast');
  t.innerHTML = (ok ? ico('check') : ico('info')) + `<span>${esc(msg)}</span>`;
  t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2400);
}

render(); syncThemeColor();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
