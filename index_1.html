<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="התיק שלי">
<meta name="theme-color" content="#0C0F14" id="themeColor">
<title>התיק שלי</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&display=swap" rel="stylesheet">
<script>try{const t=localStorage.getItem('tiki-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
/* =====================================================================
   Tokens
   Identity: private-banking ledger. Ink card, champagne engraving,
   jade for gains. Serif for money, system sans for everything else.
   ===================================================================== */
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --surface-2:#F4F5F7; --ink:#12161D; --ink-2:#394150; --muted:#5E6573;
  --line:rgba(18,22,29,.09); --line-2:rgba(18,22,29,.16);
  --gold:#3E6BC0; --gold-soft:rgba(148,180,240,.12);
  --gain:#12805A; --gain-soft:rgba(18,128,90,.11); --loss:#C0443A; --loss-soft:rgba(192,68,58,.1);
  --dep:#7C8494; --btn:#12161D; --on-btn:#F4F1EA;
  --scrim:rgba(10,12,16,.45); --shadow:0 1px 1px rgba(18,22,29,.04),0 10px 30px -12px rgba(18,22,29,.18);
  --bar:rgba(255,255,255,.78);
  /* the private card is always ink, in both themes */
  --card-a:#1B222E; --card-b:#0F131A; --card-ink:#F3EFE7; --card-muted:#A9AEB8; --card-line:rgba(243,239,231,.1);
  --card-gold:#A3C0F4; --card-gain:#6FD8A8; --card-loss:#FF8A7E;
  --serif:"Frank Ruhl Libre","David Libre","Times New Roman",serif;
  --sans:-apple-system,"SF Pro Text","SF Hebrew",system-ui,"Segoe UI","Arial Hebrew",sans-serif;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.22,.8,.2,1); --spring:cubic-bezier(.3,1.35,.5,1);
}
:root:not([data-theme="light"]){color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C0F14; --surface:#141922; --surface-2:#1B212C; --ink:#F2EEE6; --ink-2:#CFCBC3; --muted:#9A9FAB;
  --line:rgba(242,238,230,.08); --line-2:rgba(242,238,230,.14);
  --gold:#94B4F0; --gold-soft:rgba(148,180,240,.13);
  --gain:#5FD0A0; --gain-soft:rgba(95,208,160,.13); --loss:#F07A6E; --loss-soft:rgba(240,122,110,.13);
  --dep:#737B8B; --btn:#F2EEE6; --on-btn:#0C0F14; --scrim:rgba(0,0,0,.62); --shadow:none; --bar:rgba(22,27,36,.78);
  --card-a:#1A2130; --card-b:#11151D;
}}
:root[data-theme="dark"]{
  --bg:#0C0F14; --surface:#141922; --surface-2:#1B212C; --ink:#F2EEE6; --ink-2:#CFCBC3; --muted:#9A9FAB;
  --line:rgba(242,238,230,.08); --line-2:rgba(242,238,230,.14);
  --gold:#94B4F0; --gold-soft:rgba(148,180,240,.13);
  --gain:#5FD0A0; --gain-soft:rgba(95,208,160,.13); --loss:#F07A6E; --loss-soft:rgba(240,122,110,.13);
  --dep:#737B8B; --btn:#F2EEE6; --on-btn:#0C0F14; --scrim:rgba(0,0,0,.62); --shadow:none; --bar:rgba(22,27,36,.78);
  --card-a:#1A2130; --card-b:#11151D; color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:light}

/* =====================================================================
   Base
   ===================================================================== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:10px}
.n{font-variant-numeric:tabular-nums lining-nums;direction:ltr;unicode-bidi:isolate}
.serif{font-family:var(--serif)}
.muted{color:var(--muted)} .gain{color:var(--gain)} .loss{color:var(--loss)}
.press{transition:transform .16s var(--ease),opacity .16s}
.press:active{transform:scale(.975);opacity:.88}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.app{max-width:540px;margin:0 auto;padding:calc(var(--top) + 6px) 0 calc(var(--bot) + 120px)}
.view{display:none}
.view.active{display:block;animation:enter .32s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* =====================================================================
   Header
   ===================================================================== */
.head{display:flex;align-items:flex-end;justify-content:space-between;padding:10px 22px 14px;min-height:64px}
.head .hello{font-size:15px;color:var(--muted);margin-bottom:2px}
.head h1{font-family:var(--serif);font-weight:700;font-size:30px;line-height:1.1;margin:0;letter-spacing:-.01em}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--gold);
  font-family:var(--serif);font-weight:700;font-size:18px;box-shadow:var(--shadow);border:1px solid var(--line)}

/* =====================================================================
   Private card (hero)
   ===================================================================== */
.pcard{position:relative;overflow:hidden;margin:0 16px;border-radius:28px;color:var(--card-ink);
  background:radial-gradient(120% 90% at 0% 0%,rgba(148,180,240,.10),transparent 55%),linear-gradient(165deg,var(--card-a),var(--card-b));
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 30px 60px -30px rgba(8,10,14,.7);isolation:isolate}
.pcard::after{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid rgba(148,180,240,.22);pointer-events:none}
.engrave{position:absolute;left:-190px;top:-170px;width:460px;height:460px;z-index:-1;opacity:.75;pointer-events:none}
.pcard-in{padding:22px 22px 0}
.pc-top{display:flex;justify-content:space-between;align-items:center}
.pc-label{font-size:15px;color:var(--card-muted)}
.pc-mark{font-family:var(--serif);font-size:14px;color:var(--card-gold);letter-spacing:.02em}
.pc-amt{font-family:var(--serif);font-weight:500;font-size:58px;line-height:1;letter-spacing:-.02em;margin:14px 0 14px;text-align:right}
.pc-amt .cur{font-size:.5em;color:var(--card-gold);margin-left:4px;vertical-align:.55em;font-weight:500}
.pc-delta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:30px}
.chip-d{display:inline-flex;align-items:center;gap:4px;font-size:15px;font-weight:650;padding:5px 11px 5px 12px;border-radius:999px}
.chip-d svg{width:14px;height:14px;stroke-width:2.4}
.chip-d.up{background:rgba(111,216,168,.13);color:var(--card-gain)}
.chip-d.down{background:rgba(255,138,126,.13);color:var(--card-loss)}
.pc-delta .muted{color:var(--card-muted);font-size:15px}
.pc-metrics{display:grid;grid-template-columns:repeat(3,1fr);margin-top:22px;border-top:1px solid var(--card-line)}
.pc-metrics div{padding:14px 0 18px;display:flex;flex-direction:column;gap:3px}
.pc-metrics div + div{border-right:1px solid var(--card-line);padding-right:14px}
.pc-metrics small{font-size:13px;color:var(--card-muted)}
.pc-metrics b{font-family:var(--serif);font-weight:500;font-size:21px;text-align:right}
.pc-metrics .up{color:var(--card-gain)} .pc-metrics .down{color:var(--card-loss)}

/* =====================================================================
   Sections
   ===================================================================== */
.sec{padding:30px 16px 0}
.sec-h{display:flex;justify-content:space-between;align-items:center;padding:0 6px 12px;gap:12px}
.sec-h h2{font-family:var(--serif);font-weight:700;font-size:22px;margin:0;letter-spacing:-.005em}
.sec-h .aside{font-size:14px;color:var(--muted)}
.link{font-size:15px;font-weight:600;color:var(--gold);padding:8px 0}
.card{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);border:1px solid var(--line)}

/* growth chart */
.growth{padding:16px 0 12px}
.growth-top{display:flex;justify-content:space-between;align-items:flex-start;padding:0 18px;min-height:44px}
.growth-top .k{font-size:14px;color:var(--muted)}
.growth-top .v{font-family:var(--serif);font-size:20px;font-weight:500}
.chart{position:relative;margin-top:8px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:crosshair}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.keys{display:flex;gap:16px;flex-wrap:wrap;padding:10px 18px 0;font-size:13px;color:var(--muted)}
.keys span{display:inline-flex;align-items:center;gap:7px}
.k-line{width:18px;height:0;border-top:2.5px solid var(--gold);border-radius:2px}
.k-dash{width:18px;height:0;border-top:2px dashed var(--dep)}
.k-area{width:12px;height:12px;border-radius:4px;background:var(--gain-soft);border:1px solid color-mix(in srgb,var(--gain) 40%,transparent)}
.hint{font-size:13px;color:var(--muted);padding:6px 18px 0}
.pc-note{font-size:13.5px;color:var(--card-muted);margin-top:8px;min-height:0}
.pc-note:empty{display:none}
.mile{display:block;width:100%;text-align:right}
.edit-hint{display:inline-flex;align-items:center;gap:3px;font-size:13px;color:var(--gold);margin-inline-start:10px;font-weight:600}
.edit-hint svg{width:13px;height:13px}
.open-in{background:rgba(243,239,231,.06);border:1px solid var(--card-line);border-radius:22px;padding:16px 14px 14px;margin-bottom:12px;text-align:center}
.open-in label{display:block;font-size:14px;color:var(--card-muted);margin-bottom:4px}
.open-in .amt-in span{color:var(--card-gold)}
.open-in .amt-in input{color:var(--card-ink)}
.open-in .amt-in input::placeholder{color:var(--card-muted)}
.err.on-dark{color:var(--card-loss)}
.opening{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;text-align:right;margin-bottom:24px}
.opening .day{background:var(--gold-soft);color:var(--gold)}
.opening .day svg{width:20px;height:20px}
.opening .mid{flex:1;display:flex;flex-direction:column}
.opening .t{font-weight:600}.opening .s{font-size:14px;color:var(--muted)}
.opening .amt{font-family:var(--serif);font-size:20px;font-weight:500}

/* milestone */
.mile{padding:18px 18px 16px;margin-top:12px}
.mile-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mile-top .t{font-size:15px;color:var(--muted)}
.mile-top .g{font-family:var(--serif);font-size:22px;font-weight:700}
.track{height:10px;border-radius:999px;background:var(--surface-2);margin:14px 0 10px;overflow:hidden;position:relative}
.track i{position:absolute;inset:0 0 0 auto;border-radius:inherit;background:linear-gradient(90deg,var(--gold),color-mix(in srgb,var(--gold) 70%,#fff));
  transform-origin:right;transition:transform 1.1s var(--ease)}
.mile-foot{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);gap:10px;flex-wrap:wrap}
.mile-foot b{color:var(--ink);font-weight:600}

/* monthly */
.monthly{padding:16px 16px 12px}
.yr-switch{display:flex;align-items:center;gap:2px;background:var(--surface-2);border-radius:12px;padding:2px}
.yr-switch button{width:34px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2)}
.yr-switch button:disabled{opacity:.3}
.yr-switch button svg{width:18px;height:18px}
.yr-switch span{font-family:var(--serif);font-weight:700;font-size:16px;min-width:46px;text-align:center}
.m-sum{display:flex;gap:26px;padding:4px 4px 12px}
.m-sum div{display:flex;flex-direction:column}
.m-sum small{font-size:13px;color:var(--muted)}
.m-sum b{font-family:var(--serif);font-weight:500;font-size:22px;text-align:right}

/* ledger list */
.ledger{background:var(--surface);border-radius:24px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
.lrow{display:flex;align-items:center;gap:14px;width:100%;min-height:66px;padding:10px 16px;text-align:right;position:relative}
.lrow:active{background:var(--surface-2)}
.lrow + .lrow::before{content:"";position:absolute;top:0;left:16px;right:72px;border-top:1px solid var(--line)}
.day{width:44px;height:44px;border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1}
.day b{font-family:var(--serif);font-size:19px;font-weight:700}
.day small{font-size:11px;color:var(--muted);margin-top:3px}
.lrow .mid{flex:1;min-width:0;display:flex;flex-direction:column}
.lrow .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .s{font-size:14px;color:var(--muted)}
.lrow .amt{font-family:var(--serif);font-size:20px;font-weight:500}
.lrow .amt::before{content:"+";color:var(--gain);margin-left:2px;font-size:.8em}
.mgroup{margin-bottom:24px}
.mgroup-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 8px 10px}
.mgroup-h b{font-family:var(--serif);font-size:18px;font-weight:700}
.mgroup-h span{font-size:14px;color:var(--muted)}

.dep-hero{padding:4px 22px 6px}
.dep-hero small{font-size:15px;color:var(--muted)}
.dep-hero .big{font-family:var(--serif);font-size:46px;font-weight:500;letter-spacing:-.02em;line-height:1.1;text-align:right;margin-top:4px}
.dep-hero .big .cur{font-size:.5em;color:var(--gold);vertical-align:.55em;margin-left:3px}
.dep-stats{display:flex;gap:10px;padding:14px 16px 0}
.dep-stats div{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
.dep-stats small{display:block;font-size:13px;color:var(--muted)}
.dep-stats b{display:block;font-family:var(--serif);font-weight:500;font-size:20px;text-align:right;margin-top:2px}

/* years */
.ret-card{padding:16px 16px 10px;margin-bottom:14px}
.retseg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px;margin-bottom:14px;box-shadow:var(--shadow)}
.retseg button{flex:1;min-height:42px;border-radius:12px;font-weight:650;font-size:16px;color:var(--muted);transition:background .2s,color .2s}
.retseg button[aria-selected="true"]{background:var(--gold-soft);color:var(--gold)}
.ysub{font-family:var(--serif);font-size:18px;color:var(--muted);font-weight:500}
.ycard{display:block;width:100%;text-align:right;padding:18px 18px 16px;margin-bottom:12px}
.y-top{display:flex;justify-content:space-between;align-items:center}
.y-top .y{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1}
.y-top .now{font-size:12px;font-weight:650;color:var(--gold);background:var(--gold-soft);border-radius:999px;padding:3px 9px;margin-inline-start:10px;vertical-align:6px}
.retp{font-family:var(--serif);font-size:26px;font-weight:500}
.retp.none{color:var(--muted);font-size:22px}
.comp{display:flex;height:12px;border-radius:999px;overflow:hidden;margin:16px 0 12px;gap:2px;background:var(--surface-2)}
.comp i{display:block;height:100%}
.comp .c0{background:color-mix(in srgb,var(--gold) 55%,transparent)}
.comp .c1{background:var(--dep)}
.comp .c2{background:var(--gain)}
.comp .c3{background:repeating-linear-gradient(45deg,var(--loss) 0 4px,color-mix(in srgb,var(--loss) 55%,transparent) 4px 8px)}
.comp-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.comp-keys div{display:flex;flex-direction:column;gap:2px}
.comp-keys small{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.comp-keys small i{width:8px;height:8px;border-radius:50%;display:inline-block}
.comp-keys b{font-family:var(--serif);font-weight:500;font-size:18px;text-align:right}
.y-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.y-foot b{color:var(--ink);font-weight:600}
.y-foot .cta{color:var(--gold);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.y-foot .cta svg{width:16px;height:16px}

/* settings */
.slist{background:var(--surface);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
.srow{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:8px 16px;text-align:right;position:relative}
.srow + .srow::before{content:"";position:absolute;top:0;left:0;right:64px;border-top:1px solid var(--line)}
button.srow:active{background:var(--surface-2)}
.srow .ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold);flex:none}
.srow .ico svg{width:18px;height:18px}
.srow .t{flex:1}
.srow .v{color:var(--muted);font-size:15px}
.srow .chev{color:var(--muted);transform:scaleX(-1);width:18px;height:18px}
.srow.danger{color:var(--loss)} .srow.danger .ico{background:var(--loss-soft);color:var(--loss)}
.seg{display:flex;background:var(--surface-2);border-radius:11px;padding:2px}
.seg button{font-size:14px;font-weight:600;padding:6px 11px;border-radius:9px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.fine{font-size:13px;color:var(--muted);padding:10px 20px 0;line-height:1.55}
.colophon{text-align:center;font-family:var(--serif);color:var(--muted);font-size:14px;padding:30px 0 0}

/* welcome */
.welcome{margin:4px 16px 0}
.welcome .pcard-in{padding:26px 22px 24px}
.welcome h2{font-family:var(--serif);font-weight:700;font-size:30px;line-height:1.15;margin:8px 0 10px}
.welcome p{margin:0 0 22px;color:var(--card-muted);font-size:16px}
.wsteps{display:flex;flex-direction:column;gap:16px;margin-bottom:26px}
.wstep{display:flex;gap:14px;align-items:flex-start}
.wstep .no{font-family:var(--serif);font-weight:700;color:var(--card-gold);font-size:20px;width:30px;height:30px;border-radius:50%;
  border:1px solid rgba(148,180,240,.4);display:grid;place-items:center;flex:none;line-height:1}
.wstep b{display:block;color:var(--card-ink)} .wstep span{font-size:15px;color:var(--card-muted)}
.btn-gold{background:linear-gradient(180deg,#B3CCF7,#86A8EA);color:#0F1320}
.btn-ghost-dark{background:rgba(243,239,231,.08);color:var(--card-ink)}

.empty{text-align:center;padding:60px 36px;color:var(--muted)}
.empty .em{width:68px;height:68px;border-radius:22px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 16px;color:var(--gold);box-shadow:var(--shadow)}
.empty .em svg{width:30px;height:30px}
.empty b{display:block;color:var(--ink);font-family:var(--serif);font-size:22px;margin-bottom:6px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:17px;font-weight:650;font-size:17px}
.btn-main{background:var(--btn);color:var(--on-btn)}
.btn-soft{background:var(--surface-2);color:var(--ink)}
.btn-text{color:var(--loss);min-height:48px;font-weight:600}
.btn + .btn{margin-top:10px}

/* =====================================================================
   Floating tab bar
   ===================================================================== */
.dock{position:fixed;left:0;right:0;bottom:calc(var(--bot) + 10px);z-index:20;display:flex;justify-content:center;pointer-events:none}
.dock-in{pointer-events:auto;display:flex;align-items:center;gap:2px;padding:6px;border-radius:28px;background:var(--bar);
  backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
  border:1px solid var(--line-2);box-shadow:0 12px 40px -12px rgba(0,0,0,.35);width:calc(100% - 32px);max-width:420px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:54px;border-radius:22px;
  font-size:11px;font-weight:600;color:var(--muted);transition:color .2s,background .2s}
.tab svg{width:23px;height:23px}
.tab[aria-selected="true"]{color:var(--ink);background:var(--surface-2)}
.add{width:56px;height:54px;border-radius:22px;flex:none;display:grid;place-items:center;margin:0 2px;
  background:linear-gradient(180deg,#B3CCF7,#86A8EA);color:#0F1320;box-shadow:0 6px 18px -6px rgba(148,180,240,.8)}

   ===================================================================== */

/* toast */

  padding:11px 18px 11px 16px;border-radius:999px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap;

.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s var(--ease) .2s forwards}

@keyframes fade{from{opacity:0}to{opacity:1}}

<script>
/* =====================================================================
   Utils
   ===================================================================== */
const KEY = 'tiki-v1';
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('he-IL', {maximumFractionDigits: 0});
const num = n => nf.format(Math.round(Math.abs(n)));
const money = n => '₪' + num(n);
const moneyHtml = n => `<span class="cur">₪</span>${num(n)}`;
const pct = r => (r >= 0 ? '+' : '−') + Math.abs(r * 100).toFixed(1) + '%';
const compact = n => n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'K' : String(Math.round(n));
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const T = s => Date.parse(s + 'T00:00:00Z');
const days = (a, b) => (T(b) - T(a)) / 864e5;
const fDate = s => { const [y, m, d] = s.split('-'); return `${+d}.${+m}.${y}`; };
const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const MSHORT = ['ינו׳','פבר׳','מרץ','אפר׳','מאי','יוני','יולי','אוג׳','ספט׳','אוק׳','נוב׳','דצמ׳'];
const parseAmt = s => parseFloat(String(s).replace(/[^\d.]/g, ''));
const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
const curYear = () => new Date().getFullYear();
const ico = (id, cls = 'i') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ls = {get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }};

/* =====================================================================
   Data
   ===================================================================== */
function load() {
  try { const d = JSON.parse(ls.get(KEY)); if (d) return normalize(d); } catch (e) {}
  return {deposits: [], values: {}, opening: null};
}
// values are kept one per month, keyed "YYYY-MM"; older backups stored one per year
function normalize(d) {
  const values = {...(d.values || {})};
  for (const v of Object.values(d.valuations || {})) { const k = v.date.slice(0, 7); if (!values[k] || v.date >= values[k].date) values[k] = v; }
  return {deposits: d.deposits || [], values, opening: d.opening || null};
}
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('השמירה נכשלה, ייצא גיבוי', false); } }
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '' + Math.random());
const seqNow = () => Date.now();
const deps = asc => [...S.deposits].sort((a, b) => {
  const k = a.date === b.date ? (a.seq || 0) - (b.seq || 0) : (a.date < b.date ? -1 : 1);
  return asc ? k : -k;
});
const hasData = () => S.deposits.length || Object.keys(S.values).length || S.opening;
// last value entered inside a period ("2026" or "2026-09")
const lastValIn = prefix => { let b = null; for (const [k, v] of Object.entries(S.values)) if (k.startsWith(prefix) && (!b || v.date > b.date || (v.date === b.date && (v.seq || 0) > (b.seq || 0)))) b = v; return b; };
const monthEnd = (y, m) => `${y}-${pad(m)}-${pad(new Date(Date.UTC(y, m, 0)).getUTCDate())}`;

/* =====================================================================
   Calculations
   A "snapshot" is a value the user entered (opening balance or a
   valuation). Between snapshots the portfolio value is exact:
   last snapshot + every deposit entered after it. Deposits never
   count as profit.
   ===================================================================== */
// deposit d happened after snapshot s (same day: decided by entry order)
const after = (d, s) => d.date > s.date || (d.date === s.date && (d.seq || 0) > (s.seq || 0));

function snapshots() {
  const out = [];
  if (S.opening) out.push({...S.opening, opening: true});
  for (const v of Object.values(S.values)) out.push({...v});
  return out.sort((a, b) => a.date === b.date ? (a.seq || 0) - (b.seq || 0) : (a.date < b.date ? -1 : 1));
}
const lastSnapBy = date => { let s = null; for (const x of snapshots()) if (x.date <= date) s = x; return s; };

// money put in up to a date (opening balance counts as money in)
function investedAt(date) {
  const o = S.opening && S.opening.date <= date ? S.opening.value : 0;
  return o + sum(S.deposits.filter(d => d.date <= date), d => d.amount);
}
// exact portfolio value on a date
function valueAt(date) {
  const s = lastSnapBy(date);
  if (!s) return investedAt(date); // nothing entered yet: assume no profit
  return s.value + sum(S.deposits.filter(d => after(d, s) && d.date <= date), d => d.amount);
}
const endDate = () => { const t = todayISO(), last = deps(true).pop(); return last && last.date > t ? last.date : t; };

function allYears() {
  const ys = new Set([curYear()]);
  S.deposits.forEach(d => ys.add(+d.date.slice(0, 4)));
  Object.keys(S.values).forEach(k => ys.add(+k.slice(0, 4)));
  if (S.opening) ys.add(+S.opening.date.slice(0, 4));
  return [...ys].sort((a, b) => a - b);
}

// Modified Dietz: return for the year, net of deposits and of prior years
function yearStats(y) {
  const list = S.deposits.filter(d => +d.date.slice(0, 4) === y);
  const total = sum(list, d => d.amount);
  const cy = curYear();
  const endM = y < cy ? 12 : y === cy ? new Date().getMonth() + 1 : 12;
  const firstDates = [...S.deposits.map(d => d.date), ...(S.opening ? [S.opening.date] : [])].sort();
  const startM = firstDates[0] && +firstDates[0].slice(0, 4) === y ? +firstDates[0].slice(5, 7) : 1;
  const months = Math.max(1, endM - startM + 1);
  const monthly = Array.from({length: 12}, (_, m) => sum(list.filter(d => +d.date.slice(5, 7) === m + 1), d => d.amount));
  const o = {year: y, total, count: list.length, avg: total / months, monthly, val: lastValIn(String(y)),
    ret: null, profit: null, missing: null, V0: null, flows: 0, now: y === cy ? valueAt(endDate()) : null};

  // starting point of the year
  const yStart = `${y - 1}-12-31`;
  const openInYear = S.opening && +S.opening.date.slice(0, 4) === y;
  let V0 = null, startSnap = null;
  if (openInYear) { V0 = S.opening.value; startSnap = {...S.opening}; }
  else {
    const s = lastSnapBy(yStart);
    const moneyBefore = investedAt(yStart) > 0;
    if (s) { V0 = valueAt(yStart); startSnap = {date: yStart, seq: Infinity}; }
    else if (!moneyBefore) { V0 = 0; startSnap = {date: yStart, seq: Infinity}; }
    else o.missing = `חסר שווי לסוף ${y - 1}`;
  }
  o.V0 = V0;
  const end = o.val;
  if (!end) { if (!o.missing) o.missing = y === cy ? 'הזן שווי עדכני כדי לראות תשואה' : `הזן את השווי לסוף ${y}`; return o; }
  if (V0 == null) return o;
  const span = days(startSnap.date, end.date);
  if (span <= 0) return o;
  const flows = S.deposits.filter(d => after(d, startSnap) && !after(d, end));
  const F = sum(flows, d => d.amount), W = sum(flows, d => d.amount * Math.max(0, days(d.date, end.date)) / span);
  o.flows = F;
  o.profit = end.value - V0 - F;
  o.ret = V0 + W > 0 ? o.profit / (V0 + W) : null;
  return o;
}

// Modified Dietz for any period [start snapshot .. last value in period]
function periodReturn(startDate, openingInPeriod, end) {
  let V0 = null, startSnap = null, missing = null;
  if (openingInPeriod) { V0 = S.opening.value; startSnap = {...S.opening}; }
  else if (lastSnapBy(startDate)) { V0 = valueAt(startDate); startSnap = {date: startDate, seq: Infinity}; }
  else if (!(investedAt(startDate) > 0)) { V0 = 0; startSnap = {date: startDate, seq: Infinity}; }
  else missing = 'start';
  const r = {V0, ret: null, profit: null, flows: 0, missing};
  if (!end || V0 == null) return r;
  const span = days(startSnap.date, end.date);
  if (span <= 0) return r;
  const fl = S.deposits.filter(d => after(d, startSnap) && !after(d, end));
  const F = sum(fl, d => d.amount), W = sum(fl, d => d.amount * Math.max(0, days(d.date, end.date)) / span);
  r.flows = F; r.profit = end.value - V0 - F; r.ret = V0 + W > 0 ? r.profit / (V0 + W) : null;
  return r;
}

function monthStats(y, m) {
  const key = `${y}-${pad(m)}`, prevEnd = m === 1 ? monthEnd(y - 1, 12) : monthEnd(y, m - 1);
  const list = S.deposits.filter(d => d.date.startsWith(key));
  const end = lastValIn(key);
  const openIn = S.opening && S.opening.date.startsWith(key);
  const r = periodReturn(prevEnd, openIn, end);
  const now = new Date(), isCur = y === now.getFullYear() && m === now.getMonth() + 1;
  const pm = m === 1 ? 12 : m - 1;
  let missing = null;
  if (r.missing) missing = `חסר שווי לסוף ${MONTHS[pm - 1]}`;
  else if (!end) missing = isCur ? 'הזן שווי בסוף החודש כדי לראות תשואה' : `הזן שווי לסוף ${MONTHS[m - 1]}`;
  return {y, m, key, label: `${MONTHS[m - 1]} ${y}`, short: MSHORT[m - 1], total: sum(list, d => d.amount), count: list.length,
    val: end, isCur, now: isCur ? valueAt(endDate()) : null, openIn, ...r, missing};
}
const last12 = () => { const out = [], d = new Date(); for (let i = 11; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); out.push([x.getFullYear(), x.getMonth() + 1]); } return out; };

function xirr(flows) {
  const t0 = flows[0].date, f = r => flows.reduce((s, c) => s + c.amt / Math.pow(1 + r, days(t0, c.date) / 365), 0);
  let lo = -0.9999, hi = 10, flo = f(lo);
  if (flo * f(hi) > 0) return null;
  for (let i = 0; i < 200; i++) { const m = (lo + hi) / 2, fm = f(m); if (Math.abs(fm) < 1e-7) return m; if (flo * fm < 0) hi = m; else { lo = m; flo = fm; } }
  return (lo + hi) / 2;
}

function overall() {
  const today = endDate(), snaps = snapshots(), last = snaps[snaps.length - 1] || null;
  const value = valueAt(today), invested = investedAt(today), profit = value - invested;
  const sinceDeps = last ? sum(S.deposits.filter(d => after(d, last) && d.date <= today), d => d.amount) : 0;
  // average annual return, measured up to the last value the user entered
  let rate = null, annual = false;
  const lastVal = snaps.filter(s => !s.opening).pop();
  if (lastVal) {
    const flows = [];
    if (S.opening && !after({date: S.opening.date, seq: S.opening.seq}, lastVal)) flows.push({date: S.opening.date, amt: -S.opening.value});
    deps(true).filter(d => !after(d, lastVal)).forEach(d => flows.push({date: d.date, amt: -d.amount}));
    flows.sort((a, b) => a.date < b.date ? -1 : 1);
    const inv = -sum(flows, f => f.amt);
    if (flows.length) {
      if (days(flows[0].date, lastVal.date) >= 365) { rate = xirr([...flows, {date: lastVal.date, amt: lastVal.value}]); annual = true; }
      else if (inv > 0) rate = (lastVal.value - inv) / inv;
    }
  }
  return {value, invested, profit, last, sinceDeps, rate, annual, hasSnap: !!last};
}
/* =====================================================================
   Engraving (guilloché rosette, like banknote security printing)
   ===================================================================== */
function engraving() {
  const R = 100, r = 35, loops = 7, cx = 210, cy = 210, k = 1.45;
  let out = '';
  for (let j = 0; j < 7; j++) {
    const d = 38 + j * 6.5;
    let p = '';
    for (let a = 0; a <= loops * 360; a += 2) {
      const t = a * Math.PI / 180;
      const x = (R - r) * Math.cos(t) + d * Math.cos((R - r) / r * t);
      const y = (R - r) * Math.sin(t) - d * Math.sin((R - r) / r * t);
      p += (a ? 'L' : 'M') + (cx + x * k).toFixed(1) + ',' + (cy + y * k).toFixed(1);
    }
    out += `<path d="${p}" fill="none" stroke="#A3C0F4" stroke-opacity="${(0.07 + j * 0.018).toFixed(3)}" stroke-width=".6"/>`;
  }
  out += `<circle cx="${cx}" cy="${cy}" r="${(R - r + 84) * k}" fill="none" stroke="#A3C0F4" stroke-opacity=".14" stroke-width=".6"/>`;
  out += `<circle cx="${cx}" cy="${cy}" r="${(R - r + 88) * k}" fill="none" stroke="#A3C0F4" stroke-opacity=".08" stroke-width=".6"/>`;
  return `<svg class="engrave" viewBox="0 0 420 420" aria-hidden="true">${out}</svg>`;
}
const ENGRAVE = engraving();

/* =====================================================================
   Growth chart: exact value vs money invested; the gap is profit.
   Scrub to any day.
   ===================================================================== */
let CH = null;
const isoOf = t => new Date(t).toISOString().slice(0, 10);

function buildChart(anim) {
  const dl = deps(true), snaps = snapshots();
  if (!dl.length && !snaps.length) return '';
  const firstDate = [...dl.map(d => d.date), ...snaps.map(s => s.date)].sort()[0];
  const t0 = T(firstDate), tEnd = Math.max(T(endDate()), t0 + 30 * 864e5);

  // events where either line changes
  const evDates = [...new Set([firstDate, ...dl.map(d => d.date), ...snaps.map(s => s.date), isoOf(tEnd)])].sort();
  const pts = evDates.map(d => ({t: T(d), v: valueAt(d), inv: investedAt(d)}));

  const W = 380, H = 210, pT = 16, pB = 28, pL = 8, pR = 40;
  const maxV = Math.max(...pts.map(p => Math.max(p.v, p.inv))) * 1.12 || 1;
  const X = t => pL + (t - t0) / (tEnd - t0 || 1) * (W - pL - pR);
  const Y = v => pT + (H - pT - pB) * (1 - v / maxV);

  // step paths
  const step = key => { let s = ''; pts.forEach((p, i) => { const x = X(p.t).toFixed(1), y = Y(p[key]).toFixed(1);
    if (!i) s = `M${x},${y}`; else s += `L${x},${Y(pts[i - 1][key]).toFixed(1)}L${x},${y}`; }); return s; };
  const band = (hi, lo) => { const top = [], bot = [];
    pts.forEach((p, i) => { const x = X(p.t), n = pts[i + 1]; const xe = n ? X(n.t) : x;
      top.push(`${x.toFixed(1)},${Y(hi(p)).toFixed(1)}`, `${xe.toFixed(1)},${Y(hi(p)).toFixed(1)}`);
      bot.push(`${x.toFixed(1)},${Y(lo(p)).toFixed(1)}`, `${xe.toFixed(1)},${Y(lo(p)).toFixed(1)}`); });
    return top.join(' ') + ' ' + bot.reverse().join(' '); };
  const vPath = step('v'), dPath = step('inv');
  const gainPoly = band(p => Math.max(p.v, p.inv), p => p.inv), lossPoly = band(p => p.inv, p => Math.min(p.v, p.inv));

  // grid
  const stp = [1, 2, 2.5, 5].map(k => k * Math.pow(10, Math.floor(Math.log10(maxV / 3)))).find(s => maxV / s <= 4) || maxV / 3;
  let grid = '';
  for (let g = stp; g < maxV; g += stp) grid += `<line x1="${pL}" x2="${W - pR + 4}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--line)"/>
    <text x="${W - pR + 10}" y="${Y(g) + 4}" font-size="10.5" fill="var(--muted)" font-family="-apple-system,system-ui,sans-serif">${compact(g)}</text>`;
  const y0 = new Date(t0).getUTCFullYear(), y1 = new Date(tEnd).getUTCFullYear(), yrs = [];
  for (let y = y0 + 1; y <= y1; y++) yrs.push(y);
  const ev = Math.ceil(yrs.length / 5) || 1; let ticks = '';
  yrs.forEach((y, i) => { if (i % ev) return; const x = X(Date.UTC(y, 0, 1));
    ticks += `<line x1="${x}" x2="${x}" y1="${H - pB}" y2="${H - pB + 4}" stroke="var(--line-2)"/><text x="${x}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="-apple-system,system-ui,sans-serif">${y}</text>`; });

  // one dot at the end of every year inside the chart range
  const dots = [];
  for (let y = y0; y < y1; y++) { const d = `${y}-12-31`; if (T(d) >= t0 && T(d) <= tEnd) dots.push({t: T(d), v: valueAt(d), date: d, year: y}); }
  CH = {W, H, X, Y, pT, pB, t0, tEnd, dots};
  const lastX = X(tEnd), lastY = Y(pts[pts.length - 1].v);

  return `<div class="chart" id="chart" tabindex="0" role="img" aria-label="גרף צמיחת התיק. גרור או השתמש בחצים כדי לראות כל יום">
  <svg viewBox="0 0 ${W} ${H}" style="direction:ltr">
    ${grid}
    <line x1="${pL}" x2="${W - pR + 4}" y1="${H - pB}" y2="${H - pB}" stroke="var(--line-2)"/>
    ${ticks}
    <polygon points="${gainPoly}" fill="var(--gain)" fill-opacity=".16" class="${anim ? 'fadein' : ''}"/>
    <polygon points="${lossPoly}" fill="var(--loss)" fill-opacity=".18" class="${anim ? 'fadein' : ''}"/>
    <path d="${dPath}" fill="none" stroke="var(--dep)" stroke-width="1.6" stroke-dasharray="3.5 3.5"/>
    <path d="${vPath}" fill="none" stroke="var(--gold)" stroke-width="2.4" stroke-linejoin="round" pathLength="1" class="${anim ? 'draw' : ''}"/>
    ${dots.map(p => `<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="5" fill="var(--gold)" stroke="var(--surface)" stroke-width="2.5"/>`).join('')}
    <g id="cur" style="display:none">
      <line id="cLine" y1="${pT - 4}" y2="${H - pB}" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="2 3"/>
      <circle id="cDep" r="3.5" fill="var(--dep)" stroke="var(--surface)" stroke-width="2"/>
      <circle id="cVal" r="6" fill="var(--gold)" stroke="var(--surface)" stroke-width="2.5"/>
    </g>
    <circle id="endDot" cx="${lastX}" cy="${lastY}" r="5.5" fill="var(--gold)" stroke="var(--surface)" stroke-width="2.5"/>
  </svg></div>`;
}

function bindChart(onShow, onHide) {
  const el = $('#chart'); if (!el || !CH) return;
  const svg = el.querySelector('svg'); let cur = null, active = false;
  const show = t => {
    t = Math.max(CH.t0, Math.min(CH.tEnd, t));
    // snap to a yearly dot when close to it
    const px = CH.X(t); let snap = null;
    CH.dots.forEach(d => { if (Math.abs(CH.X(d.t) - px) < 10) snap = d; });
    if (snap) t = snap.t;
    const date = isoOf(t); if (date === cur) return; cur = date;
    const v = valueAt(date), inv = investedAt(date), x = CH.X(T(date));
    $('#cur').style.display = '';
    $('#cLine').setAttribute('x1', x); $('#cLine').setAttribute('x2', x);
    $('#cDep').setAttribute('cx', x); $('#cDep').setAttribute('cy', CH.Y(inv));
    $('#cVal').setAttribute('cx', x); $('#cVal').setAttribute('cy', CH.Y(v));
    $('#endDot').style.display = 'none';
    onShow({date, value: v, inv, year: snap ? snap.year : null});
  };
  const hide = () => { cur = null; $('#cur').style.display = 'none'; $('#endDot').style.display = ''; onHide(); };
  const tAt = cx => { const r = svg.getBoundingClientRect(), x = (cx - r.left) / r.width * CH.W; return CH.t0 + (x - CH.X(CH.t0)) / (CH.X(CH.tEnd) - CH.X(CH.t0)) * (CH.tEnd - CH.t0); };
  el.addEventListener('pointerdown', e => { active = true; el.setPointerCapture(e.pointerId); show(tAt(e.clientX)); });
  el.addEventListener('pointermove', e => { if (active || e.pointerType === 'mouse') show(tAt(e.clientX)); });
  const end = () => { active = false; hide(); };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  el.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') end(); });
  el.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); const base = cur ? T(cur) : CH.tEnd; show(base + (e.key === 'ArrowRight' ? 30 : -30) * 864e5); }
    if (e.key === 'Escape') hide();
  });
  el.addEventListener('blur', () => cur && hide());
}
/* monthly bars */
function monthBars(st, H = 120) {
  const W = 360, pB = 22, pT = 10, max = Math.max(1, ...st.monthly) * 1.15;
  const cy = curYear(), cm = new Date().getMonth(), gap = W / 12, bw = gap * 0.5;
  const aY = pT + (H - pT - pB) * (1 - st.avg / max);
  const bars = st.monthly.map((v, i) => {
    const fut = st.year === cy && i > cm, bh = v > 0 ? Math.max(5, (H - pT - pB) * v / max) : 3;
    const x = gap * i + (gap - bw) / 2, y = H - pB - bh;
    const fill = fut ? 'var(--line)' : v > 0 ? (v >= st.avg ? 'var(--gold)' : 'color-mix(in srgb,var(--gold) 55%,transparent)') : 'var(--line-2)';
    return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="${Math.min(6, bw / 2)}" fill="${fill}"><title>${MONTHS[i]}: ${money(v)}</title></rect>
      <text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="10.5" fill="${fut ? 'var(--line-2)' : 'var(--muted)'}" font-family="-apple-system,system-ui,sans-serif">${i + 1}</text>`;
  }).join('');
  const avg = st.avg > 0 ? `<line x1="0" x2="${W}" y1="${aY}" y2="${aY}" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="2 4" opacity=".55"/>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;direction:ltr" role="img" aria-label="הפקדות לפי חודש ב-${st.year}, ממוצע ${money(st.avg)}">${bars}${avg}</svg>`;
}

function returnsChart(items, title, lab, min = 2) {
  const s = items.filter(x => x.ret != null);
  if (s.length < min) return '';
  const n = items.length, dense = n > 6;
  const W = 360, H = dense ? 170 : 160, pB = 24, pT = dense ? 26 : 24;
  const m = Math.max(0.02, ...s.map(x => Math.abs(x.ret))), neg = s.some(x => x.ret < 0);
  const zero = neg ? pT + (H - pT - pB) / 2 : H - pB, k = (neg ? (H - pT - pB) / 2 : H - pT - pB) / m;
  const gap = W / n, bw = Math.min(46, gap * (dense ? 0.62 : 0.5));
  const fs = dense ? 9.5 : 14, rx = dense ? 4 : 8;
  return `<div class="card ret-card"><div class="sec-h" style="padding:0 4px 4px"><h2 style="font-size:19px">${title}</h2><span class="aside">בלי ההפקדות</span></div>
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;direction:ltr" role="img" aria-label="${title}">
    <line x1="0" x2="${W}" y1="${zero}" y2="${zero}" stroke="var(--line-2)"/>
    ${items.map((x, i) => { const cx = gap * i + gap / 2, label = `<text x="${cx}" y="${H - 6}" text-anchor="middle" font-size="${dense ? 10 : 11.5}" fill="var(--muted)" font-family="-apple-system,system-ui,sans-serif">${lab(x)}</text>`;
      if (x.ret == null) return `<line x1="${cx - bw / 3}" x2="${cx + bw / 3}" y1="${zero}" y2="${zero}" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" opacity=".5"/>${label}`;
      const h = Math.max(2, Math.abs(x.ret) * k), up = x.ret >= 0, y = up ? zero - h : zero, col = up ? 'var(--gain)' : 'var(--loss)';
      const txt = dense ? (up ? '+' : '−') + Math.abs(x.ret * 100).toFixed(1) : pct(x.ret);
      return `<rect x="${cx - bw / 2}" y="${y}" width="${bw}" height="${h}" rx="${rx}" fill="${col}" fill-opacity=".9"/>
      <text x="${cx}" y="${up ? y - 6 : y + h + (dense ? 12 : 16)}" text-anchor="middle" font-size="${fs}" font-weight="500" fill="${col}" font-family="Frank Ruhl Libre,serif">${txt}</text>${label}`; }).join('')}
  </svg>${dense ? '<div class="hint" style="padding:4px 4px 0">האחוזים בגרף מעוגלים. הערך המדויק בכרטיס של החודש.</div>' : ''}</div>`;
}

function chipD(profit, base, label) {
  const up = profit >= 0, p = base > 0 ? ` (${pct(profit / base)})` : '';

}

function countUp(el, target) {
  const t0 = performance.now(), dur = 1100;
  const tick = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 4); el.innerHTML = moneyHtml(target * e); if (k < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}

let retTab = ls.get('tiki-rettab') || 'years';
function yearCards(stats, cy) {
  return [...stats].reverse().map(s => {
      const hasRes = s.profit != null;
      let comp = '', keys = '';
      if (hasRes) {
        const V0 = s.V0 || 0, F = s.flows, P = s.profit;
        const w = v => (v / (V0 + F + Math.abs(P)) * 100).toFixed(2) + '%';
        comp = `<div class="comp" aria-hidden="true">${V0 > 0 ? `<i class="c0" style="width:${w(V0)}"></i>` : ''}${F > 0 ? `<i class="c1" style="width:${w(F)}"></i>` : ''}${P !== 0 ? `<i class="${P > 0 ? 'c2' : 'c3'}" style="width:${w(Math.abs(P))}"></i>` : ''}</div>`;
        keys = `<div class="comp-keys">
          <div><small><i style="background:color-mix(in srgb,var(--gold) 55%,transparent)"></i>${S.opening && +S.opening.date.slice(0, 4) === s.year ? 'יתרת פתיחה' : 'בתחילת השנה'}</small><b class="n">${money(V0)}</b></div>
          <div><small><i style="background:var(--dep)"></i>הפקדות</small><b class="n">${money(F)}</b></div>
          <div><small><i style="background:${P >= 0 ? 'var(--gain)' : 'var(--loss)'}"></i>${P >= 0 ? 'רווח' : 'הפסד'}</small><b class="n ${P >= 0 ? 'gain' : 'loss'}">${money(P)}</b></div></div>`;
      } else {
        keys = `<div class="comp-keys" style="margin-top:16px">
          <div><small>הופקד</small><b class="n">${money(s.total)}</b></div>
          <div><small>ממוצע לחודש</small><b class="n">${money(s.avg)}</b></div>
          <div><small>${s.year === cy ? 'שווי היום' : 'שווי'}</small><b class="n">${s.year === cy ? money(s.now) : s.val ? money(s.val.value) : '—'}</b></div></div>`;
      }
      return `<button class="card ycard press" data-year="${s.year}">
        <div class="y-top"><span><span class="y n">${s.year}</span>${s.year === cy ? '<span class="now">השנה</span>' : ''}</span>
          <span class="retp n ${s.ret == null ? 'none' : s.ret >= 0 ? 'gain' : 'loss'}">${s.ret == null ? '—' : pct(s.ret)}</span></div>
        ${comp}${keys}
        <div class="y-foot">${hasRes ? `<span>${s.year === cy ? `שווי היום <b class="n">${money(s.now)}</b>` : `שווי בסוף השנה <b class="n">${money(s.val.value)}</b>`}</span><span class="cta">פירוט${ico('next')}</span>`
          : `<span>${s.missing}</span><span class="cta">${ico('edit')}עדכון</span>`}</div>
      </button>`; }).join('');
}

function comp(V0, F, P, startLabel) {
  const w = v => (v / (V0 + F + Math.abs(P) || 1) * 100).toFixed(2) + '%';
  return `<div class="comp" aria-hidden="true">${V0 > 0 ? `<i class="c0" style="width:${w(V0)}"></i>` : ''}${F > 0 ? `<i class="c1" style="width:${w(F)}"></i>` : ''}${P !== 0 ? `<i class="${P > 0 ? 'c2' : 'c3'}" style="width:${w(Math.abs(P))}"></i>` : ''}</div>
    <div class="comp-keys">
      <div><small><i style="background:color-mix(in srgb,var(--gold) 55%,transparent)"></i>${startLabel}</small><b class="n">${money(V0)}</b></div>
      <div><small><i style="background:var(--dep)"></i>הפקדות</small><b class="n">${money(F)}</b></div>
      <div><small><i style="background:${P >= 0 ? 'var(--gain)' : 'var(--loss)'}"></i>${P >= 0 ? 'רווח' : 'הפסד'}</small><b class="n ${P >= 0 ? 'gain' : 'loss'}">${money(P)}</b></div></div>`;
}

function monthCards(list) {
  return [...list].reverse().map(s => {
    const has = s.profit != null;
    const body = has ? comp(s.V0 || 0, s.flows, s.profit, s.openIn ? 'יתרת פתיחה' : 'בתחילת החודש')
      : `<div class="comp-keys" style="margin-top:16px">
          <div><small>הופקד</small><b class="n">${money(s.total)}</b></div>
          <div><small>הפקדות</small><b class="n">${s.count}</b></div>
          <div><small>${s.isCur ? 'שווי היום' : 'שווי'}</small><b class="n">${s.isCur ? money(s.now) : s.val ? money(s.val.value) : '—'}</b></div></div>`;
    return `<button class="card ycard press" data-month="${s.key}">
      <div class="y-top"><span><span class="y">${MONTHS[s.m - 1]}</span> <span class="ysub n">${s.y}</span>${s.isCur ? '<span class="now">החודש</span>' : ''}</span>
        <span class="retp n ${s.ret == null ? 'none' : s.ret >= 0 ? 'gain' : 'loss'}">${s.ret == null ? '—' : pct(s.ret)}</span></div>
      ${body}
      <div class="y-foot">${has ? `<span>${s.isCur ? `שווי היום <b class="n">${money(s.now)}</b>` : `שווי בסוף החודש <b class="n">${money(s.val.value)}</b>`}</span><span class="cta">פירוט${ico('next')}</span>`
        : `<span>${s.missing}</span><span class="cta">${ico('edit')}עדכון</span>`}</div>
    </button>`; }).join('');
}

function renderYears() {

function openSheet(title, body) {
  const sh = $('#sheet');
  sh.innerHTML = `<div class="grab" id="grab"><i></i></div><div class="sh-h"><h3 id="shTitle">${title}</h3><button class="x press" data-close aria-label="סגירה">${ico('x')}</button></div>${body}`;
  sh.scrollTop = 0; sh.style.transform = '';
  $('#scrim').classList.add('open'); sh.classList.add('open');
  sh.querySelectorAll('.amt-in input').forEach(fit);
  const g = $('#grab'); let y0 = null, dy = 0;
  g.onpointerdown = e => { y0 = e.clientY; dy = 0; sh.classList.add('drag'); g.setPointerCapture(e.pointerId); };
  g.onpointermove = e => { if (y0 == null) return; dy = Math.max(0, e.clientY - y0); sh.style.transform = `translateY(${dy}px)`; };
  g.onpointerup = g.onpointercancel = () => { if (y0 == null) return; y0 = null; sh.classList.remove('drag'); if (dy > 90) closeSheet(); else sh.style.transform = ''; };
}
function closeSheet() { $('#scrim').classList.remove('open'); const sh = $('#sheet'); sh.classList.remove('open'); sh.style.transform = ''; }
function fit(el) { const n = (el.value || el.placeholder).length; el.style.width = (n * 0.58 + 0.35) + 'em'; }
document.addEventListener('input', e => { if (e.target.matches('.amt-in input')) fit(e.target); });
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

  </div>`);
}

function depSheet(id) {
  const d = id ? S.deposits.find(x => x.id === id) : null;
  const quick = [...new Set(deps(false).map(x => x.amount))].slice(0, 3);
  openSheet(d ? 'עריכת הפקדה' : 'הפקדה חדשה', `
    <div class="amtbox"><label for="fAmt">סכום</label>
      <div class="amt-in"><span>₪</span><input id="fAmt" inputmode="decimal" autocomplete="off" placeholder="0" value="${d ? d.amount : ''}"></div>
      ${!d && quick.length ? `<div class="qchips">${quick.map(a => `<button class="qchip press n" data-q="${a}">${money(a)}</button>`).join('')}</div>` : ''}</div>
    <div class="err" id="fErr" role="alert"></div>
    <label class="field"><span>תאריך</span><input type="date" id="fDate" value="${d ? d.date : todayISO()}" max="${todayISO()}"></label>
    <label class="field"><span>הערה, לא חובה</span><input id="fNote" maxlength="50" placeholder="לדוגמה: משכורת ספטמבר" value="${d && d.note ? esc(d.note) : ''}"></label>
    <button class="btn btn-main press" id="fSave">${d ? 'שמירת שינויים' : 'הוספת הפקדה'}</button>
    ${d ? '<button class="btn btn-text" id="fDel">מחיקת ההפקדה</button>' : ''}`);
  const a = $('#fAmt'); if (!d) setTimeout(() => a.focus(), 380);

}

function valSheet(key) {
  // key: "YYYY-MM" to edit/enter a specific month, or "YYYY" for a year end
  const now = new Date(), today = todayISO();
  let def;
  if (key && key.length === 7) { const [y, m] = key.split('-').map(Number); def = S.values[key] ? S.values[key].date : (y === now.getFullYear() && m === now.getMonth() + 1 ? today : monthEnd(y, m)); }
  else if (key) { const y = +key; def = y === now.getFullYear() ? today : monthEnd(y, 12); }
  // early in the month you are usually entering last month's closing value
  else def = now.getDate() <= 5 ? monthEnd(now.getMonth() === 0 ? now.getFullYear() - 1 : now.getFullYear(), now.getMonth() === 0 ? 12 : now.getMonth()) : today;
  const k0 = def.slice(0, 7), v = S.values[k0];
  openSheet('שווי התיק', `
    <p class="lead">הזן את השווי שמופיע באפליקציית ההשקעות, רצוי ביום האחרון של החודש. לכל חודש נשמר שווי אחד.</p>

      <div class="amt-in"><span>₪</span><input id="vAmt" inputmode="decimal" autocomplete="off" placeholder="0" value="${v ? v.value : ''}"></div></div>
    <div class="err" id="vErr" role="alert"></div>
    <label class="field"><span>נכון לתאריך</span><input type="date" id="vDate" value="${def}" max="${today}"></label>

    <button class="btn btn-main press" id="vSave">שמירת שווי</button>
    <button class="btn btn-text" id="vDel" style="display:none">מחיקת השווי של החודש</button>`);
  const info = () => { const d = $('#vDate').value; if (!d) return; const k = d.slice(0, 7), ex = S.values[k], [y, m] = k.split('-').map(Number);
    $('#vInfo').textContent = ex ? `כבר הזנת שווי ל${MONTHS[m - 1]} ${y}: ${money(ex.value)}. השמירה תחליף אותו.` : `שווי ל${MONTHS[m - 1]} ${y}`;
    $('#vDel').style.display = ex ? '' : 'none'; };
  $('#vDate').addEventListener('change', info); info();
  setTimeout(() => $('#vAmt').focus(), 380);
  $('#vSave').onclick = () => {
    const value = parseAmt($('#vAmt').value), date = $('#vDate').value;
    if (isNaN(value) || value < 0) { $('#vErr').textContent = 'הזן את שווי התיק'; return; }
    if (!date) { $('#vErr').textContent = 'בחר תאריך'; return; }
    const k = date.slice(0, 7), [y, m] = k.split('-').map(Number);
    S.values[k] = {value, date, seq: seqNow()}; save(); render(); closeSheet(); toast(`השווי של ${MONTHS[m - 1]} ${y} נשמר`);
  };
  $('#vDel').onclick = () => { const k = $('#vDate').value.slice(0, 7); if (!S.values[k] || !confirm('למחוק את השווי של החודש?')) return;
    delete S.values[k]; save(); render(); closeSheet(); toast('השווי נמחק'); };
}

    <div class="err" id="gErr" role="alert"></div>
    <button class="btn btn-main press" id="gSave">שמירת יעד</button>
    ${g ? '<button class="btn btn-soft press" id="gAuto">חזרה ליעד אוטומטי</button>' : ''}`);
  setTimeout(() => $('#gAmt').focus(), 380);
  $('#gSave').onclick = () => { const v = parseAmt($('#gAmt').value); if (!(v > 0)) { $('#gErr').textContent = 'הזן סכום גדול מ-0'; return; }
    ls.set('tiki-goal', String(v)); render(); closeSheet(); toast(`היעד נקבע ל-${money(v)}`); };
  if (g) $('#gAuto').onclick = () => { ls.set('tiki-goal', null); render(); closeSheet(); toast('היעד חזר לאוטומטי'); };
}

function nameSheet() {
  openSheet('השם שלך', `<p class="lead">מופיע בברכה במסך הראשי.</p>
    <label class="field"><span>שם</span><input id="nIn" maxlength="20" autocomplete="given-name" value="${esc(ls.get('tiki-name') || '')}"></label>
    <button class="btn btn-main press" id="nSave">שמירה</button>`);
  setTimeout(() => $('#nIn').focus(), 380);
  $('#nSave').onclick = () => { const v = $('#nIn').value.trim(); ls.set('tiki-name', v || null); render(); closeSheet(); toast('נשמר'); };
}

function explainSheet() {
  openSheet('איך מחושבת התשואה', `<div class="explain">
    <p><b>תשואה שנתית</b> מודדת רק את מה שהתיק הרוויח בשנה עצמה, מ-1.1 עד 31.12. ההפקדות לא נספרות כרווח, והרווח של שנים קודמות לא נכנס.</p>
    <div class="formula">רווח = שווי בסוף − שווי בתחילה − הפקדות</div>
    <p>את הרווח מחלקים בכסף שעבד בפועל: השווי בתחילת השנה, ועוד כל הפקדה לפי הזמן שהייתה בתיק. הפקדה מינואר נספרת כמעט במלואה, הפקדה מדצמבר כמעט לא. השיטה נקראת Modified Dietz.</p>
    <p><b>שווי התיק</b> הוא השווי האחרון שהזנת, ועוד כל ההפקדות שהזנת אחריו. ההפקדות מגדילות את השווי אבל לא את הרווח.</p>
    <p><b>יתרת פתיחה</b> היא השווי שהזנת כשהתחלת. היא נספרת ככסף שהושקע, ולכן הרווח מתחיל ממנה מ-0.</p>
    <p><b>ממוצע שנתי</b> בכרטיס הראשי היא ממוצע שנתי על כל התקופה, בשיטת XIRR. היא מוצגת אחרי שנה של נתונים.</p>
    <p><b>ממוצע חודשי</b> הוא סך ההפקדות בשנה חלקי מספר החודשים שעברו בה.</p></div>
    <button class="btn btn-soft press" data-close>הבנתי</button>`);
}

/* =====================================================================
   Backup
   ===================================================================== */
async function exportData() {
  const name = `tiki-backup-${todayISO()}.json`, blob = new Blob([JSON.stringify({app: 'tiki', v: 1, ...S}, null, 2)], {type: 'application/json'});
  try { const f = new File([blob], name, {type: 'application/json'}); if (navigator.canShare && navigator.canShare({files: [f]})) { await navigator.share({files: [f], title: name}); return; } }
  catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text()); if (!Array.isArray(d.deposits) || (typeof d.valuations !== 'object' && typeof d.values !== 'object')) throw 0;
    if (!confirm(`לייבא ${d.deposits.length} הפקדות? הנתונים הנוכחיים יוחלפו.`)) return;
    S = normalize(d); save(); firstPaint = true; render(); toast('הגיבוי יובא');
  } catch (err) { toast('הקובץ לא תקין', false); }
});
function loadSample() {
  const list = [], values = {}, now = new Date(), cy = now.getFullYear(), cm = now.getMonth() + 1;
  const rs = [.021, -.013, .034, .008, -.027, .019, .041, .006, -.009, .025, .012, -.018, .031, .004, .017, -.022, .028, .011, -.006, .023, .015, -.031, .026, .009, .014, .02, -.011, .018, .007, .024, -.015];
  let V = 0, i = 0;
  for (let y = cy - 2; y <= cy; y++) for (let m = 1; m <= 12; m++) {
    if (y === cy && m > cm) break; if (y === cy - 2 && m < 4) continue;
    const a = y === cy - 2 ? 500 : y === cy - 1 ? 750 : 1000;
    let dep = 0;
    if ((y * 12 + m) % 7 !== 0) { dep = a + (m === 12 ? 1500 : 0); list.push({id: uid(), date: `${y}-${pad(m)}-10`, amount: dep, note: m === 12 ? 'בונוס שנתי' : '', seq: 0}); }
    V = (V + dep) * (1 + rs[i++ % rs.length] * (V ? 1 : .3));
    const isCur = y === cy && m === cm;
    if (!isCur) values[`${y}-${pad(m)}`] = {value: Math.round(V), date: monthEnd(y, m), seq: 0};
    else if (now.getDate() > 10) values[`${y}-${pad(m)}`] = {value: Math.round(V), date: todayISO(), seq: 1};
  }
  S = {opening: null, deposits: list, values};
  save(); firstPaint = true; render(); toast('נטענו נתוני דוגמה');
}

/* =====================================================================
   Navigation & events
   ===================================================================== */
function go(v) {
  $$('.view').forEach(el => el.classList.toggle('active', el.id === 'v-' + v));
  $$('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.v === v));
  window.scrollTo(0, 0);
}
$$('.tab').forEach(t => t.addEventListener('click', () => go(t.dataset.v)));
$('#addBtn').addEventListener('click', () => { if (!hasData()) { go('home'); const i = $('#oAmt'); if (i) i.focus(); toast('קודם מזינים את שווי התיק היום', false); return; } addMenu(); });
document.addEventListener('click', e => {
  const t = e.target.closest('[data-close],[data-act],[data-dep],[data-year],[data-month],[data-ret],[data-go],[data-theme-set],[data-bar]'); if (!t) return;
  if (t.hasAttribute('data-close')) return closeSheet();
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.dep) return depSheet(t.dataset.dep);
  if (t.dataset.year) return yearSheet(+t.dataset.year);
  if (t.dataset.month) return monthSheet(t.dataset.month);
  if (t.dataset.ret) { retTab = t.dataset.ret; ls.set('tiki-rettab', retTab); return renderYears(); }
  if (t.dataset.themeSet) return setTheme(t.dataset.themeSet);
  if (t.dataset.bar) { barYear += +t.dataset.bar; return renderHome(); }
  switch (t.dataset.act) {
    case 'dep': return depSheet();
    case 'val': return valSheet(t.dataset.y || null);
    case 'sample': return loadSample();
    case 'export': return exportData();
    case 'import': return $('#importFile').click();
    case 'explain': return explainSheet();
    case 'name': return nameSheet();
    case 'goal': return goalSheet();
    case 'opening': return openingSheet();
    case 'open': {
      const a = $('#oAmt'), v = parseAmt(a.value);
      if (isNaN(v) || v < 0 || a.value.trim() === '') { $('#oErr').textContent = 'הזן את שווי התיק היום. אם עוד אין לך תיק, הזן 0'; a.focus(); return; }
      S.opening = {value: v, date: todayISO(), seq: seqNow()}; save(); firstPaint = true; render(); toast('מתחילים. עכשיו אפשר להוסיף הפקדות'); return;
    }
    case 'wipe': if (!confirm('למחוק את כל ההפקדות והשווי? אי אפשר לבטל.')) return;
      S = {deposits: [], values: {}, opening: null}; ls.set('tiki-goal', null); save(); firstPaint = true; render(); go('home'); toast('כל הנתונים נמחקו');
  }
});
function setTheme(k) {
  ls.set('tiki-theme', k === 'auto' ? null : k);
  if (k === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = k;
  syncBar(); renderSet();
}
function syncBar() { $('#themeColor').setAttribute('content', getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncBar);

let tt;
function toast(msg, ok = true) {
  const t = $('#toast'); t.innerHTML = ico(ok ? 'check' : 'info') + `<span>${esc(msg)}</span>`;
  t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2400);
}

render(); syncBar();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
